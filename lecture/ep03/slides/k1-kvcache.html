<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>k1-kvcache</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#16181B;--card:#202328;--card2:#272B31;--fg:#ECECEC;--mu:#9AA0A6;--bl:#58C4DD;--yl:#FFE066;--gr:#5CD0B3;--rd:#FC6255;--pu:#B189F5}
html,body{margin:0;background:#16181B}*{box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);font-family:"Noto Sans SC",sans-serif;padding:72px 100px;-webkit-font-smoothing:antialiased;text-wrap:pretty}
h1{font:900 54px/1.25 "Noto Sans SC";margin:0;letter-spacing:.01em}
.sub{font-size:25px;color:var(--mu);margin-top:14px;line-height:1.5;max-width:1600px}
.bl{color:var(--bl)}.yl{color:var(--yl)}.gr{color:var(--gr)}.rd{color:var(--rd)}.pu{color:var(--pu)}.mu{color:var(--mu)}
.mono,.chip{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
.card{background:var(--card);border-radius:18px;padding:26px 30px}
.vec{display:inline-flex;gap:4px;vertical-align:middle}.vec i{width:18px;height:18px;display:block;border-radius:4px}
.vcol{display:inline-flex;flex-direction:column;gap:4px;vertical-align:middle}.vcol i{width:34px;height:12px;display:block;border-radius:3px}
.ar{color:#5F666E;font-size:40px;display:flex;align-items:center;justify-content:center}
.foot{position:absolute;left:100px;bottom:40px;font-size:18px;color:#6E757C}
.cat{display:block;object-fit:cover;border-radius:12px}
.chip{display:inline-block;font:500 22px Menlo,"SF Mono",monospace;padding:6px 12px;border-radius:8px;margin:4px}
table{border-collapse:collapse;width:100%}
td,th{padding:14px 18px;text-align:left;font-size:23px;border-bottom:1px solid #2E3238}
th{color:var(--mu);font-weight:500;font-size:20px}
.tag{display:inline-block;font-size:18px;padding:3px 10px;border-radius:6px;background:var(--card2);color:var(--mu)}
body{padding-top:96px}.nav{position:absolute;left:100px;right:100px;top:22px;display:flex;gap:10px}
.nv{border-top:4px solid #2E3238;padding-top:6px}.nv.past{border-color:#58C4DD66}.nv.cur{border-color:var(--c)}
.nl{font-size:16px;color:#6E757C;white-space:nowrap}.nv.past .nl{color:#8A9199}.nv.cur .nl{color:var(--c);font-weight:700}
.take{position:absolute;left:100px;right:100px;bottom:70px;font:900 30px "Noto Sans SC";border-top:2px solid #2E3238;padding-top:18px}.take i{font-style:normal;color:var(--yl)}
.foot{bottom:28px}.n{font-size:22px;line-height:1.7}.n b{display:block;font-size:26px;margin-bottom:8px}
.stp{font:700 22px "Noto Sans SC";color:var(--mu);margin-bottom:10px}.stp b{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--card2);color:var(--fg);align-items:center;justify-content:center;margin-right:8px;font-size:20px}.fig{position:absolute;left:0;top:0;font-family:"Noto Sans SC",sans-serif}.fig .m{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none}</style></head><body><div class="nav"><div class="nv past" style="flex:4.5;--c:var(--fg)"><div class="nl">输入输出</div></div><div class="nv past" style="flex:5.5;--c:var(--yl)"><div class="nl">谁能看见谁</div></div><div class="nv past" style="flex:5.5;--c:var(--pu)"><div class="nl">位置怎么编号</div></div><div class="nv past" style="flex:4.5;--c:var(--gr)"><div class="nl">时间</div></div><div class="nv cur" style="flex:5.5;--c:var(--rd)"><div class="nl">代价 · 1/3</div></div><div class="nv" style="flex:4.5;--c:var(--fg)"><div class="nl">总结</div></div></div><h1>每写一个字都要回看全部：所以把 <span class="rd">K 和 V 存起来</span></h1><div class="sub">新写的字要拿自己的 Q 和前面每个 token 的 K 打分、再取它们的 V。前面的 K、V 不会变，每次重算太浪费，就存下来复用，这叫 KV cache。</div><svg class="fig" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="abl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#58C4DD"/></marker><marker id="ayl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FFE066"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5CD0B3"/></marker><marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FC6255"/></marker><marker id="apu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B189F5"/></marker><marker id="amu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9AA0A6"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ECECEC"/></marker><marker id="adk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5F666E"/></marker><marker id="aln" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2E3238"/></marker><marker id="acard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#202328"/></marker><marker id="acard2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#272B31"/></marker><marker id="abg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#16181B"/></marker><marker id="asv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C9CDD2"/></marker></defs><g transform="translate(0,0)"><circle cx="117" cy="330" r="17" fill="#ECECEC"/><text x="117" y="337" fill="#16181B" font-size="20" font-weight="900" text-anchor="middle" opacity="1"><tspan x="117" dy="0">1</tspan></text><text x="146" y="338" fill="#ECECEC" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="146" dy="0">读题（prefill）</tspan></text><text x="100" y="380" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="100" dy="0">整串一次算完，</tspan><tspan x="100" dy="33">每个 token 的 K、V</tspan><tspan x="100" dy="33">存进 cache。</tspan><tspan x="100" dy="33">图在这一步只算一遍。</tspan></text><circle cx="117" cy="590" r="17" fill="#ECECEC"/><text x="117" y="597" fill="#16181B" font-size="20" font-weight="900" text-anchor="middle" opacity="1"><tspan x="117" dy="0">2</tspan></text><text x="146" y="598" fill="#ECECEC" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="146" dy="0">写答案（decode）</tspan></text><text x="100" y="640" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="100" dy="0">每写一个字，只算它</tspan><tspan x="100" dy="33">自己的 Q、K、V，</tspan><tspan x="100" dy="33">和 cache 里全部 K、V</tspan><tspan x="100" dy="33">打分，再把它的 K、V</tspan><tspan x="100" dy="33">也存进去。</tspan></text><rect x="430" y="304" width="30" height="34" rx="6" fill="#2E3238" opacity="1"/><line x1="445" y1="346" x2="445" y2="378" stroke="#C9CDD2" stroke-width="2" opacity="0.8" marker-end="url(#asv)"/><rect x="464" y="304" width="30" height="34" rx="6" fill="#2E3238" opacity="1"/><line x1="479" y1="346" x2="479" y2="378" stroke="#C9CDD2" stroke-width="2" opacity="0.8" marker-end="url(#asv)"/><svg x="498" y="306" width="30" height="30" viewBox="20.0 80.0 80.0 80.0" preserveAspectRatio="xMidYMid slice"><image href="../assets/cat.png" width="360" height="320"/></svg><rect x="498" y="306" width="30" height="30" rx="4" fill="none" opacity="1" stroke="#16181B" stroke-width="1"/><line x1="513" y1="346" x2="513" y2="378" stroke="#C9CDD2" stroke-width="2" opacity="0.8" marker-end="url(#asv)"/><svg x="532" y="306" width="30" height="30" viewBox="100.0 80.0 80.0 80.0" preserveAspectRatio="xMidYMid slice"><image href="../assets/cat.png" width="360" height="320"/></svg><rect x="532" y="306" width="30" height="30" rx="4" fill="none" opacity="1" stroke="#16181B" stroke-width="1"/><line x1="547" y1="346" x2="547" y2="378" stroke="#C9CDD2" stroke-width="2" opacity="0.8" marker-end="url(#asv)"/><svg x="566" y="306" width="30" height="30" viewBox="180.0 80.0 80.0 80.0" preserveAspectRatio="xMidYMid slice"><image href="../assets/cat.png" width="360"
