ke="#FFE066" stroke-width="2" opacity="1" marker-end="url(#ayl)"/><circle cx="1247" cy="691" r="17" fill="#FFE066"/><text x="1247" y="698" fill="#16181B" font-size="20" font-weight="900" text-anchor="middle" opacity="1"><tspan x="1247" dy="0">2</tspan></text><text x="1276" y="700" fill="#FFE066" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="1276" dy="0">训练时也照这个规矩</tspan></text><text x="1230" y="740" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="1230" dy="0">整段文字一次喂进去，每一行只看前面，</tspan><tspan x="1230" dy="33">于是一次就能同时练</tspan><tspan x="1230" dy="33">「猜第 2 个字、猜第 3 个字……」</tspan></text><text x="100" y="330" fill="#9AA0A6" font-size="20" font-weight="400" text-anchor="start" opacity="1"><tspan x="100" dy="0">行 = 正在算的 token，列 = 被看的 token</tspan></text><text x="100" y="362" fill="#9AA0A6" font-size="20" font-weight="400" text-anchor="start" opacity="1"><tspan x="100" dy="0"><tspan fill="#9AA0A6" font-weight="700">灰</tspan> = 题目里的字　<tspan fill="#FFE066" font-weight="700">黄</tspan> = 要写出来的字</tspan></text></g></svg><div class="take"><i>因果注意力</i>：只看前面，才能一个字一个字地写</div><div class="foot">来源：transformers qwen3_vl 源码 + HF Qwen3-VL-8B-Instruct config（2026-10-02 核对）；LLM 只调用 create_causal_mask</div></body></html>
