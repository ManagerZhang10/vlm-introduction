52.0" y="323.92" fill="#FFE066" font-size="22" font-weight="500" text-anchor="middle" opacity="1"><tspan x="1152.0" dy="0">题</tspan></text><rect x="634" y="790.0" width="44" height="44" rx="8" fill="#FFE06633" opacity="1"/><text x="656.0" y="819.92" fill="#FFE066" font-size="22" font-weight="500" text-anchor="middle" opacity="1"><tspan x="656.0" dy="0">题</tspan></text><rect x="977.0" y="427.0" width="70.0" height="70.0" rx="10" fill="none" opacity="1" stroke="#FC6255" stroke-width="4"/><path d="M540,427.0 L942.0,427.0 L974.0,458.0" stroke="#FC6255" stroke-width="2" fill="none" opacity="1" marker-end="url(#ard)"/><circle cx="117" cy="421" r="17" fill="#FC6255"/><text x="117" y="428" fill="#16181B" font-size="20" font-weight="900" text-anchor="middle" opacity="1"><tspan x="117" dy="0">1</tspan></text><text x="146" y="430" fill="#FC6255" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="146" dy="0">左上角的块看不到右下角</tspan></text><text x="100" y="470" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="100" dy="0">会不会丢信息？不会太多：</tspan><tspan x="100" dy="33">图块在 ViT 里已经全图互相看过了，</tspan><tspan x="100" dy="33">进大模型时每块都已知道整张图的大意。</tspan></text><rect x="1045.0" y="425.0" width="144.0" height="284.0" rx="10" fill="none" opacity="1" stroke="#9AA0A6" stroke-width="4" stroke-dasharray="9 7"/><line x1="1230" y1="400" x2="1194" y2="532.0" stroke="#C9CDD2" stroke-width="2" opacity="1" marker-end="url(#asv)"/><circle cx="1267" cy="391" r="17" fill="#C9CDD2"/><text x="1267" y="398" fill="#16181B" font-size="20" font-weight="900" text-anchor="middle" opacity="1"><tspan x="1267" dy="0">3</tspan></text><text x="1296" y="400" fill="#C9CDD2" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="1296" dy="0">所以问题最好放在图后面</tspan></text><text x="1250" y="440" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="1250" dy="0">千问没规定顺序，由调用的人决定。</tspan><tspan x="1250" dy="33">问题写在图前面，问
