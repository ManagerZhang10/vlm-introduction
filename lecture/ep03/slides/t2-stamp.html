<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>t2-stamp</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#16181B;--card:#202328;--card2:#272B31;--fg:#ECECEC;--mu:#9AA0A6;--bl:#58C4DD;--yl:#FFE066;--gr:#5CD0B3;--rd:#FC6255;--pu:#B189F5}
html,body{margin:0;background:#16181B}*{box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);font-family:"Noto Sans SC",sans-serif;padding:72px 100px;-webkit-font-smoothing:antialiased;text-wrap:pretty}
h1{font:900 54px/1.25 "Noto Sans SC";margin:0;letter-spacing:.01em}
.sub{font-size:25px;color:var(--mu);margin-top:14px;line-height:1.5;max-width:1600px}
.bl{color:var(--bl)}.yl{color:var(--yl)}.gr{color:var(--gr)}.rd{color:var(--rd)}.pu{color:var(--pu)}.mu{color:var(--mu)}
.mono,.chip{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
.card{background:var(--card);border-radius:18px;padding:26px 30px}
.vec{display:inline-flex;gap:4px;vertical-align:middle}.vec i{width:18px;height:18px;display:block;border-radius:4px}
.vcol{display:inline-flex;flex-direction:column;gap:4px;vertical-align:middle}.vcol i{width:34px;height:12px;display:block;border-radius:3px}
.ar{color:#5F666E;font-size:40px;display:flex;align-items:center;justify-content:center}
.foot{position:absolute;left:100px;bottom:40px;font-size:18px;color:#6E757C}
.cat{display:block;object-fit:cover;border-radius:12px}
.chip{display:inline-block;font:500 22px Menlo,"SF Mono",monospace;padding:6px 12px;border-radius:8px;margin:4px}
table{border-collapse:collapse;width:100%}
td,th{padding:14px 18px;text-align:left;font-size:23px;border-bottom:1px solid #2E3238}
th{color:var(--mu);font-weight:500;font-size:20px}
.tag{display:inline-block;font-size:18px;padding:3px 10px;border-radius:6px;background:var(--card2);color:var(--mu)}
body{padding-top:96px}.nav{position:absolute;left:100px;right:100px;top:22px;display:flex;gap:10px}
.nv{border-top:4px solid #2E3238;padding-top:6px}.nv.past{border-color:#58C4DD66}.nv.cur{border-color:var(--c)}
.nl{font-size:16px;color:#6E757C;white-space:nowrap}.nv.past .nl{color:#8A9199}.nv.cur .nl{color:var(--c);font-weight:700}

.foot{bottom:28px}.n{font-size:22px;line-height:1.7}.n b{display:block;font-size:26px;margin-bottom:8px}

="xMidYMid slice"><image href="../assets/cat.png" width="360" height="320"/></svg><rect x="302" y="570" width="54" height="54" rx="4" fill="none" opacity="1" stroke="#16181B" stroke-width="1"/><svg x="360" y="570" width="54" height="54" viewBox="180.0 0.0 160.0 160.0" preserveAspectRatio="xMidYMid slice"><image href="../assets/cat.png" width="360" height="320"/></svg><rect x="360" y="570" width="54" height="54" rx="4" fill="none" opacity="1" stroke="#16181B" stroke-width="1"/><svg x="418" y="570" width="54" height="54" viewBox="180.0 160.0 160.0 160.0" preserveAspectRatio="xMidYMid slice"><image href="../assets/cat.png" width="360" height="320"/></svg><rect x="418" y="570" width="54" height="54" rx="4" fill="none" opacity="1" stroke="#16181B" stroke-width="1"/><rect x="486" y="570" width="196" height="54" rx="8" fill="#FFE06633" opacity="1"/><text x="584.0" y="604.92" fill="#FFE066" font-size="22" font-weight="500" text-anchor="middle" opacity="1" class="m"><tspan x="584.0" dy="0">&lt;1.0 seconds&gt;</tspan></text><svg x="688" y="570" width="54" height="54" viewBox="20.0 0.0 160.0 160.0" preserveAspectRatio="xMidYMid slice"><image href="../assets/cat.png" width="360" height="320"/></svg><rect x="688" y="570" width="54" height="54" rx="4" fill="none" opacity="1" stroke="#16181B" stroke-width="1"/><svg x="746" y="570" width="54" height="54" viewBox="180.0 0.0 160.0 160.0" preserveAspectRatio="xMidYMid slice"><image href="../assets/cat.png" width="360" height="320"/></svg><rect x="746" y="570" width="54" height="54" rx="4" fill="none" opacity="1" stroke="#16181B" stroke-width="1"/><svg x="804" y="570" width="54" height="54" viewBox="180.0 160.0 160.0 160.0" preserveAspectRatio="xMidYMid slice"><image href="../assets/cat.png" width="360" height="320"/></svg><rect x="804" y="570" width="54" height="54" rx="4" fill="none" opacity="1" stroke="#16181B" stroke-width="1"/><rect x="872" y="570" width="196" height="54" rx="8" fill="#FFE06633" opacity="1"/><text x="970.0" y="604.92" fill="#FFE066" font-size="22" font-weight="500" text-anchor="middle" opacity="1" class="m"><tspan x="970.0" dy="0">&lt;2.0 seconds&gt;</tspan></text><svg x="1074" y="570" width="54" height="54" viewBox="20.0 0.0 160.0 160.0" preserveAspectRatio="xMidYMid slice"><image href="../assets/cat.png" width="360" height="320"/></svg><rect x="1074" y="570" width="54" height="54" rx="4" fill="none" opacity="1" stroke="#16181B" stroke-width="1"/><svg x="1132" y="570" width="54" height="54" viewBox="180.0 0.0 160.0 160.0" preserveAspectRatio="xMidYMid slice"><image href="../assets/cat.png" width="360" height="320"/></svg><rect x="1132" y="570" width="54" height="54" rx="4" fill="none" opacity="1" stroke="#16181B" stroke-width="1"/><svg x="1190" y="570" width="54" height="54" viewBox="180.0 160.0 160.0 160.0" preserveAspectRatio="xMidYMid slice"><image href="../assets/cat.png" width="360" height="320"/></svg><rect x="1190" y="570" width="54" height="54" rx="4" fill="none" opacity="1" stroke="#16181B" stroke-width="1"/><rect x="1258" y="570" width="46" height="54" rx="8" fill="#2E3238" opacity="1"/><text x="1281.0" y="604.92" fill="#ECECEC" font-size="22" font-weight="500" text-anchor="middle" opacity="1"><tspan x="1281.0" dy="0">…</tspan></text><rect x="1310" y="570" width="250" height="54" rx="8" fill="#2E3238" opacity="1"/><text x="1435.0" y="604.92" fill="#ECECEC" font-size="22" font-weight="500" text-anchor="middle" opacity="1"><tspan x="1435.0" dy="0">猫在第几秒打哈欠？</tspan></text><path d="M486,632 L486,640 L682,640 L682,632" stroke="#FFE066" stroke-width="2" fill="none" opacity="1"/><line x1="584.0" y1="640" x2="584.0" y2="648" stroke="#FFE066" stroke-width="2" opacity="1"/><line x1="584.0" y1="650" x2="584.0" y2="684" stroke="#FFE066" stroke-width="2" opacity="1" marker-end="url(#ayl)"/><text x="456" y="718" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="456" dy="0"><tspan fill="#FFE066" font-weight="900">代价：</tspan>每组多几个字，上下文略长一点。</tspan></text><text x="456" y="754" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="456" dy="0">训练时秒数和「时:分:秒」两种写法都用，让模型认得不同格式。</tspan></text><path d="M1435,562 C1435,510 970,510 970,562" stroke="#5CD0B3" stroke-width="2.5" fill="none" opacity="1" stroke-dasharray="7 6" marker-end="url(#agr)"/><text x="1435" y="500" fill="#5CD0B3" font-size="20" font-weight="700" text-anchor="middle" opacity="1"><tspan x="1435" dy="0">读字就知道时间</tspan></text><rect x="1250" y="790" width="570" height="112" rx="12" fill="#FC625518" opacity="1" stroke="#FC6255" stroke-width="2"/><text x="1276" y="830" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="1276" dy="0"><tspan fill="#FC6255" font-weight="900">一个坑：</tspan>调用时不传视频帧率，</tspan></text><text x="1276" y="866" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="1276" dy="0">处理器默认按每秒 24 帧算，秒数就对不上。</tspan></text></g></svg><div class="take">时间<i>靠读字</i>，不靠位置号</div><div class="foot">来源：Qwen3-VL 技术报告 arXiv 2511.21631 §2.3；时间戳格式出自报告，图中秒数为示意；24 fps 默认值来自 transformers video processor</div></body></html>
