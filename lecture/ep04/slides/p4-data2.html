<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>p4-data2</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#16181B;--card:#202328;--card2:#272B31;--fg:#ECECEC;--mu:#9AA0A6;--bl:#58C4DD;--yl:#FFE066;--gr:#5CD0B3;--rd:#FC6255;--pu:#B189F5}
html,body{margin:0;background:#16181B}*{box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);font-family:"Noto Sans SC",sans-serif;padding:72px 100px;-webkit-font-smoothing:antialiased;text-wrap:pretty}
h1{font:900 54px/1.25 "Noto Sans SC";margin:0;letter-spacing:.01em}
.sub{font-size:25px;color:var(--mu);margin-top:14px;line-height:1.5;max-width:1600px}
.bl{color:var(--bl)}.yl{color:var(--yl)}.gr{color:var(--gr)}.rd{color:var(--rd)}.pu{color:var(--pu)}.mu{color:var(--mu)}
.mono,.chip{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
.card{background:var(--card);border-radius:18px;padding:26px 30px}
.vec{display:inline-flex;gap:4px;vertical-align:middle}.vec i{width:18px;height:18px;display:block;border-radius:4px}
.vcol{display:inline-flex;flex-direction:column;gap:4px;vertical-align:middle}.vcol i{width:34px;height:12px;display:block;border-radius:3px}
.ar{color:#5F666E;font-size:40px;display:flex;align-items:center;justify-content:center}
.foot{position:absolute;left:100px;bottom:40px;font-size:18px;color:#6E757C}
.cat{display:block;object-fit:cover;border-radius:12px}
.chip{display:inline-block;font:500 22px Menlo,"SF Mono",monospace;padding:6px 12px;border-radius:8px;margin:4px}
table{border-collapse:collapse;width:100%}
td,th{padding:14px 18px;text-align:left;font-size:23px;border-bottom:1px solid #2E3238}
th{color:var(--mu);font-weight:500;font-size:20px}
.tag{display:inline-block;font-size:18px;padding:3px 10px;border-radius:6px;background:var(--card2);color:var(--mu)}
body{padding-top:96px}.nav{position:absolute;left:100px;right:100px;top:22px;display:flex;gap:10px}
.nv{border-top:4px solid #2E3238;padding-top:6px}.nv.past{border-color:#58C4DD66}.nv.cur{border-color:var(--c)}
.nl{font-size:16px;color:#6E757C;white-space:nowrap}.nv.past .nl{color:#8A9199}.nv.cur .nl{color:var(--c);font-weight:700}
.take{position:absolute;left:100px;right:100px;bottom:70px;font:900 30px "Noto Sans SC";border-top:2px solid #2E3238;padding-top:18px}.take i{font-style:normal;color:var(--yl)}
.foot{bottom:28px}.n{font-size:22px;line-height:1.7}.n b{display:block;font-size:26px;margin-bottom:8px}
.stp{font:700 22px "Noto Sans SC";color:var(--mu);margin-bottom:10px}.stp b{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--card2);color:var(--fg);align-items:center;justify-content:center;margin-right:8px;font-size:20px}.fig{position:absolute;left:0;top:0;font-family:"Noto Sans SC",sans-serif}.fig .m{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none}</style></head><body><div class="nav"><div class="nv past" style="flex:4.5;--c:var(--fg)"><div class="nl">输入输出</div></div><div class="nv past" style="flex:5.5;--c:var(--yl)"><div class="nl">训练目标</div></div><div class="nv past" style="flex:4.5;--c:var(--pu)"><div class="nl">经典两段</div></div><div class="nv cur" style="flex:9.5;--c:var(--bl)"><div class="nl">预训练 · 5/7</div></div><div class="nv" style="flex:6.5;--c:var(--gr)"><div class="nl">后训练</div></div><div class="nv" style="flex:6.5;--c:var(--rd)"><div class="nl">强化学习</div></div><div class="nv" style="flex:4.5;--c:var(--fg)"><div class="nl">总结</div></div></div><h1>1 万亿 token 从哪来（二）：<span class="bl">OCR、文档、定位</span>，伪标签 + 模型修正</h1><div class="sub">读字和找位置是 CLIP 式编码器最弱的地方，需要大量精确标注。这里同样几乎不用人工：专用小模型先出初稿，Qwen2.5-VL 系列修正和识别。</div><svg class="fig" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="abl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#58C4DD"/></marker><marker id="ayl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FFE066"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5CD0B3"/></marker><marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FC6255"/></marker><marker id="apu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B189F5"/></marker><marker id="amu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9AA0A6"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ECECEC"/></marker><marker id="adk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5F666E"/></marker><marker id="aln" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2E3238"/></marker><marker id="acard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#202328"/></marker><marker id="acard2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#272B31"/></marker><marker id="abg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#16181B"/></marker><marker id="asv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C9CDD2"/></marker></defs><g transform="translate(0,0)"><text x="100" y="330" fill="#58C4DD" font-size="28" font-weight="900" text-anchor="start" opacity="1"><tspan x="100" dy="0">OCR 与文档</tspan></text><circle cx="117" cy="371" r="17" fill="#58C4DD"/><text x="117" y="378" fill="#16181B" font-size="20" font-weight="900" text-anchor="middle" opacity="1"><tspan x="117" dy="0">1</tspan></text><text x="146" y="380" fill="#58C4DD" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="146" dy="0">真实图 OCR：3000 万条</tspan></text><text x="100" y="420" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="100" dy="0">专用 OCR 模型出伪标签 → Qwen2.5-VL 修正</tspan><tspan x="100" dy="33">全程没有人工标注</tspan></text><circle cx="117" cy="511" r="17" fill="#58C4DD"/><text x="117" y="518" fill="#16181B" font-size="20" font-weight="900" text-anchor="middle" opacity="1"><tspan x="117" dy="0">2</tspan></text><text x="146" y="520" fill="#58C4DD" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="146" dy="0">多语言：再加 29 种</tspan></text><text x="100" y="560" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="100" dy="0">合成约 3000 万条 + 100 万张真实图</tspan><tspan x="100" dy="33">（Qwen2.5-VL 已支持中英外 10 种）</tspan></text><circle cx="117" cy="651" r="17" fill="#58C4DD"/><text x="117" y="658" fill="#16181B" font-size="20" font-weight="900" text-anchor="middle" opacity="1"><tspan x="117" dy="0">3</tspan></text><text x="146" y="660" fill="#58C4DD" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="146" dy="0">文档解析：300 万 PDF + 400 万内部文档</tspan></text><text x="100" y="700" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="100" dy="0">PDF 来自 Common Crawl，10 类各 30 万；</tspan><tspan x="100" dy="33">版面模型定阅读顺序和区域 → Qwen2.5-VL-72B 分区识别</tspan><tspan x="100" dy="33">→ 拼回成 HTML（带框）/ Markdown（表格写 LaTeX）</tspan></text><text x="1100" y="330" fill="#FFE066" font-size="28" font-weight="900" text-anchor="start" opacity="1"><tspan x="1100" dy="0">定位：坐标统一成 0～1000</tspan></text><svg x="1100" y="360" width="576" height="324" viewBox="-110 0 580 320" preserveAspectRatio="xMidYMid slice"><image href="../assets/cat.png" width="360" height="320"/></svg><rect x="1100" y="360" width="576" height="324" rx="6" fill="none" opacity="1" stroke="#5F666E" stroke-width="2"/><rect x="1310.0" y="420.0" width="180.0" height="240.0" rx="4" fill="none" opacity="1" stroke="#FFE066" stroke-width="4"/><text x="1100" y="720" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1" class="m"><tspan x="1100" dy="0">1920×1080 的图，框 (700, 200, 1300, 1000) 像素</tspan></text><text x="1100" y="758" fill="#FFE066" font-size="22" font-weight="700" text-anchor="start" opacity="1" class="m"><tspan x="1100" dy="0">→ (365, 185, 677, 926)：每个数 ÷ 宽或高 × 1000</tspan></text><text x="1100" y="806" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="1100" dy="0">不管原图多大、什么比例，输出都在同一个尺度上。</tspan></text><text x="1100" y="846" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="start" opacity="1"><tspan x="1100" dy="0">框数据：COCO、Objects365 等 + 自动合成（Qwen2.5-VL</tspan><tspan x="1100" dy="30">提候选 → Grounding DINO 和 Qwen2.5-VL 标框 → 过滤）</tspan></text></g></svg><div class="take">坐标改成<i>0～1000</i>，分辨率和长宽比就不再影响输出</div><div class="foot">来源：Qwen3-VL 技术报告 arXiv 2511.21631 §3.2.3–3.2.4（p6–7）；框坐标为示意算例</div></body></html>
