735.5999999999999" y="702" fill="#9AA0A6" font-size="20" font-weight="700" text-anchor="start" opacity="1" class="m"><tspan x="735.5999999999999" dy="0">65.3</tspan></text><rect x="420" y="714" width="324.0" height="30" rx="5" fill="#58C4DD" opacity="0.9"/><text x="756.0" y="738" fill="#58C4DD" font-size="20" font-weight="700" text-anchor="start" opacity="1" class="m"><tspan x="756.0" dy="0">67.0</tspan></text><text x="100" y="808" fill="#ECECEC" font-size="22" font-weight="700" text-anchor="start" opacity="1"><tspan x="100" dy="0">OmniBench（内部）</tspan></text><rect x="420" y="774" width="121.20000000000002" height="30" rx="5" fill="#5F666E" opacity="1"/><text x="553.2" y="798" fill="#9AA0A6" font-size="20" font-weight="700" text-anchor="start" opacity="1" class="m"><tspan x="553.2" dy="0">50.1</tspan></text><rect x="420" y="810" width="156.0" height="30" rx="5" fill="#58C4DD" opacity="0.9"/><text x="588.0" y="834" fill="#58C4DD" font-size="20" font-weight="700" text-anchor="start" opacity="1" class="m"><tspan x="588.0" dy="0">53.0</tspan></text><text x="420" y="880" fill="#9AA0A6" font-size="20" font-weight="400" text-anchor="start" opacity="1"><tspan x="420" dy="0"><tspan fill="#9AA0A6" font-weight="700">灰</tspan> SigLIP-2 原版　<tspan fill="#58C4DD" font-weight="700">蓝</tspan> 续训后的 Qwen3-ViT（条从 40 分起画）</tspan></text><circle cx="1277" cy="371" r="17" fill="#58C4DD"/><text x="1277" y="378" fill="#16181B" font-size="20" font-weight="900" text-anchor="middle" opacity="1"><tspan x="1277" dy="0">1</tspan></text><text x="1306" y="380" fill="#58C4DD" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="1306" dy="0">为什么要续训</tspan></text><text x="1260" y="420" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="1260" dy="0">Qwen3-VL 按原图尺寸切块：长宽对齐到 32，</tspan><tspan x="1260" dy="33">一张图 64～16384 个 token，</tspan><tspan x="1260" dy="33">位置表要插值，再叠 2D RoPE。</tspan><tspan x="1260" dy="33">官方权重没按这种方式练过。</tspan></text><circle cx="1277" cy="601" r="17" fill="#58C4DD"/><text x="1277" y="608" fill="#16181B" font-size="20" font-weight="900" text-anchor="middle" opacity="1"><tspan x="1277" dy="0">2</tspan></text><text x="1306" y="610" fill="#58C4DD" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="1306" dy="0">怎么续训</tspan></text><text x="1260" y="650" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="1260" dy="0">报告：从 SigLIP-2 官方权重出发，</tspan><tspan x="1260" dy="33">用动态分辨率继续训练（图文对比式）。</tspan><tspan x="1260" dy="33">用了多少数据、多少步：没写。</tspan></text><circle cx="1277" cy="801" r="17" fill="#5CD0B3"/><text x="1277" y="808" fill="#16181B" font-size="20" font-weight="900" text-anchor="middle" opacity="1"><tspan x="1277" dy="0">3</tspan></text><text x="1306" y="810" fill="#5CD0B3" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="1306" dy="0">效果</tspan></text><text x="1260" y="850" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="1260" dy="0">ImageNet 零样本 84.2 → 84.6 基本持平；</tspan><tspan x="1260" dy="33">接上大模型后，读图类任务全部变好。</tspan></text></g></svg><div class="take">先把<i>眼睛</i>换成能看任意尺寸的，再接大脑</div><div class="foot">来源：Qwen3-VL 技术报告 arXiv 2511.21631 §2 p3、§5.12.1 Table 11（p24）；SigLIP-2 arXiv 2502.14786</div></body></html>
