<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>p3-data1</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#16181B;--card:#202328;--card2:#272B31;--fg:#ECECEC;--mu:#9AA0A6;--bl:#58C4DD;--yl:#FFE066;--gr:#5CD0B3;--rd:#FC6255;--pu:#B189F5}
html,body{margin:0;background:#16181B}*{box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);font-family:"Noto Sans SC",sans-serif;padding:72px 100px;-webkit-font-smoothing:antialiased;text-wrap:pretty}
h1{font:900 54px/1.25 "Noto Sans SC";margin:0;letter-spacing:.01em}
.sub{font-size:25px;color:var(--mu);margin-top:14px;line-height:1.5;max-width:1600px}
.bl{color:var(--bl)}.yl{color:var(--yl)}.gr{color:var(--gr)}.rd{color:var(--rd)}.pu{color:var(--pu)}.mu{color:var(--mu)}
.mono,.chip{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
.card{background:var(--card);border-radius:18px;padding:26px 30px}
.vec{display:inline-flex;gap:4px;vertical-align:middle}.vec i{width:18px;height:18px;display:block;border-radius:4px}
.vcol{display:inline-flex;flex-direction:column;gap:4px;vertical-align:middle}.vcol i{width:34px;height:12px;display:block;border-radius:3px}
.ar{color:#5F666E;font-size:40px;display:flex;align-items:center;justify-content:center}
.foot{position:absolute;left:100px;bottom:40px;font-size:18px;color:#6E757C}
.cat{display:block;object-fit:cover;border-radius:12px}
.chip{display:inline-block;font:500 22px Menlo,"SF Mono",monospace;padding:6px 12px;border-radius:8px;margin:4px}
table{border-collapse:collapse;width:100%}
td,th{padding:14px 18px;text-align:left;font-size:23px;border-bottom:1px solid #2E3238}
th{color:var(--mu);font-weight:500;font-size:20px}
.tag{display:inline-block;font-size:18px;padding:3px 10px;border-radius:6px;background:var(--card2);color:var(--mu)}
body{padding-top:96px}.nav{position:absolute;left:100px;right:100px;top:22px;display:flex;gap:10px}
.nv{border-top:4px solid #2E3238;padding-top:6px}.nv.past{border-color:#58C4DD66}.nv.cur{border-color:var(--c)}
.nl{font-size:16px;color:#6E757C;white-space:nowrap}.nv.past .nl{color:#8A9199}.nv.cur .nl{color:var(--c);font-weight:700}
.take{position:absolute;left:100px;right:100px;bottom:70px;font:900 30px "Noto Sans SC";border-top:2px solid #2E3238;padding-top:18px}.take i{font-style:normal;color:var(--yl)}
.foot{bottom:28px}.n{font-size:22px;line-height:1.7}.n b{display:block;font-size:26px;margin-bottom:8px}
.stp{font:700 22px "Noto Sans SC";color:var(--mu);margin-bottom:10px}.stp b{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--card2);color:var(--fg);align-items:center;justify-content:center;margin-right:8px;font-size:20px}.fig{position:absolute;left:0;top:0;font-family:"Noto Sans SC",sans-serif}.fig .m{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none}</style></head><body><div class="nav"><div class="nv past" style="flex:4.5;--c:var(--fg)"><div class="nl">输入输出</div></div><div class="nv past" style="flex:5.5;--c:var(--yl)"><div class="nl">训练目标</div></div><div class="nv past" style="flex:4.5;--c:var(--pu)"><div class="nl">经典两段</div></div><div class="nv cur" style="flex:9.5;--c:var(--bl)"><div class="nl">预训练 · 4/7</div></div><div class="nv" style="flex:7.5;--c:var(--gr)"><div class="nl">后训练</div></div><div class="nv" style="flex:6.5;--c:var(--rd)"><div class="nl">强化学习</div></div><div class="nv" style="flex:4.5;--c:var(--fg)"><div class="nl">总结</div></div></div><h1>1 万亿 token 从哪来（一）：<span class="bl">让上一代模型重写描述</span></h1><div class="sub">网页上的图配的文字往往很短、和图不太对得上。Qwen3-VL 不靠人工标注，而是让上一代 Qwen2.5-VL 把描述重写得更细，再用去重和聚类控制质量与覆盖面。</div><svg class="fig" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="abl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#58C4DD"/></marker><marker id="ayl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FFE066"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5CD0B3"/></marker><marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FC6255"/></marker><marker id="apu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B189F5"/></marker><marker id="amu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9AA0A6"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ECECEC"/></marker><marker id="adk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5F666E"/></marker><marker id="aln" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2E3238"/></marker><marker id="acard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#202328"/></marker><marker id="acard2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#272B31"/></marker><marker id="abg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#16181B"/></marker><marker id="asv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C9CDD2"/></marker></defs><g transform="translate(0,0)"><text x="100" y="330" fill="#58C4DD" font-size="28" font-weight="900" text-anchor="start" opacity="1"><tspan x="100" dy="0">图片描述</tspan></text><rect x="100" y="356" width="380" height="100" rx="12" fill="#202328" opacity="1" stroke="#58C4DD" stroke-width="2"/><text x="118" y="394" fill="#58C4DD" font-size="22" font-weight="900" text-anchor="start" opacity="1"><tspan x="118" dy="0">网页图 + 原始文字</tspan></text><text x="118" y="428" fill="#C9CDD2" font-size="19" font-weight="400" text-anchor="start" opacity="1"><tspan x="118" dy="0">中英为主，alt-text 常常很短</tspan></text><line x1="486" y1="406.0" x2="520" y2="406.0" stroke="#C9CDD2" stroke-width="3" opacity="1" marker-end="url(#asv)"/><rect x="526" y="356" width="380" height="100" rx="12" fill="#202328" opacity="1" stroke="#58C4DD" stroke-width="2"/><text x="544" y="394" fill="#58C4DD" font-size="22" font-weight="900" text-anchor="start" opacity="1"><tspan x="544" dy="0">Qwen2.5-VL-32B 重写</tspan></text><text x="544" y="428" fill="#C9CDD2" font-size="19" font-weight="400" text-anchor="start" opacity="1"><tspan x="544" dy="0">专门微调来写描述，参考原文字</tspan></text><line x1="912" y1="406.0" x2="946" y2="406.0" stroke="#C9CDD2" stroke-width="3" opacity="1" marker-end="url(#asv)"/><rect x="952" y="356" width="380" height="100" rx="12" fill="#202328" opacity="1" stroke="#58C4DD" stroke-width="2"/><text x="970" y="394" fill="#58C4DD" font-size="22" font-weight="900" text-anchor="start" opacity="1"><tspan x="970" dy="0">只按文本去重</tspan></text><text x="970" y="428" fill="#C9CDD2" font-size="19" font-weight="400" text-anchor="start" opacity="1"><tspan x="970" dy="0">语义相似度，不删视觉上的多样性</tspan></text><line x1="1338" y1="406.0" x2="1372" y2="406.0" stroke="#C9CDD2" stroke-width="3" opacity="1" marker-end="url(#asv)"/><rect x="1378" y="356" width="380" height="100" rx="12" fill="#202328" opacity="1" stroke="#58C4DD" stroke-width="2"/><text x="1396" y="394" fill="#58C4DD" font-size="22" font-weight="900" text-anchor="start" opacity="1"><tspan x="1396" dy="0">按视觉聚类补缺</tspan></text><text x="1396" y="428" fill="#C9CDD2" font-size="19" font-weight="400" text-anchor="start" opacity="1"><tspan x="1396" dy="0">找分布稀疏的区域定向补数据</tspan></text><svg x="100" y="500" width="120" height="107" viewBox="0 0 360 320" preserveAspectRatio="xMidYMid slice"><image href="../assets/cat.png" width="360" height="320"/></svg><text x="240" y="530" fill="#9AA0A6" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="240" dy="0">原始：「IMG_2034 可爱」</tspan></text><text x="240" y="572" fill="#58C4DD" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="240" dy="0">重写：「一只白色折耳猫正对镜头，圆眼睛，背景是浅色墙面……」</tspan></text><text x="240" y="606" fill="#5F666E" font-size="18" font-weight="400" text-anchor="start" opacity="1"><tspan x="240" dy="0">（示意例子，不是报告原文）</tspan></text><line x1="100" y1="650" x2="1820" y2="650" stroke="#2E3238" stroke-width="2" opacity="1"/><text x="100" y="700" fill="#58C4DD" font-size="28" font-weight="900" text-anchor="start" opacity="1"><tspan x="100" dy="0">视觉知识</tspan></text><text x="100" y="744" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="100" dy="0">十几类实体：动物、植物、地标、食物、车、电子产品、衣服……</tspan></text><text x="100" y="782" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="100" dy="0">长尾分布：常见实体多采，罕见实体少采但保留；</tspan></text><text x="100" y="820" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="100" dy="0">泛泛的 alt-text 换成大模型写的描述（主体 + 属性 + 周围 + 空间关系）。</tspan></text><text x="980" y="700" fill="#58C4DD" font-size="28" font-weight="900" text-anchor="start" opacity="1"><tspan x="980" dy="0">交错图文</tspan></text><text x="980" y="744" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="980" dy="0">中英文网页：Qwen 小模型打领域分，删广告、推广、标题党；</tspan></text><text x="980" y="782" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="980" dy="0">书：微调过的 Qwen2.5-VL-7B 解析，图和文字对齐；</tspan></text><text x="980" y="820" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="980" dy="0">连续页拼成最长 256K 的序列，要求最少页数和图文比例。</tspan></text></g></svg><div class="take">描述数据的质量，来自<i>上一代模型</i></div><div class="foot">来源：Qwen3-VL 技术报告 arXiv 2511.21631 §3.2.1–3.2.2（p5–6）；数量报告未写</div></body></html>
