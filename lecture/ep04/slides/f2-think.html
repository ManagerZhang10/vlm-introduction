<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>f2-think</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#16181B;--card:#202328;--card2:#272B31;--fg:#ECECEC;--mu:#9AA0A6;--bl:#58C4DD;--yl:#FFE066;--gr:#5CD0B3;--rd:#FC6255;--pu:#B189F5}
html,body{margin:0;background:#16181B}*{box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);font-family:"Noto Sans SC",sans-serif;padding:72px 100px;-webkit-font-smoothing:antialiased;text-wrap:pretty}
h1{font:900 54px/1.25 "Noto Sans SC";margin:0;letter-spacing:.01em}
.sub{font-size:25px;color:var(--mu);margin-top:14px;line-height:1.5;max-width:1600px}
.bl{color:var(--bl)}.yl{color:var(--yl)}.gr{color:var(--gr)}.rd{color:var(--rd)}.pu{color:var(--pu)}.mu{color:var(--mu)}
.mono,.chip{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
.card{background:var(--card);border-radius:18px;padding:26px 30px}
.vec{display:inline-flex;gap:4px;vertical-align:middle}.vec i{width:18px;height:18px;display:block;border-radius:4px}
.vcol{display:inline-flex;flex-direction:column;gap:4px;vertical-align:middle}.vcol i{width:34px;height:12px;display:block;border-radius:3px}
.ar{color:#5F666E;font-size:40px;display:flex;align-items:center;justify-content:center}
.foot{position:absolute;left:100px;bottom:40px;font-size:18px;color:#6E757C}
.cat{display:block;object-fit:cover;border-radius:12px}
.chip{display:inline-block;font:500 22px Menlo,"SF Mono",monospace;padding:6px 12px;border-radius:8px;margin:4px}
table{border-collapse:collapse;width:100%}
td,th{padding:14px 18px;text-align:left;font-size:23px;border-bottom:1px solid #2E3238}
th{color:var(--mu);font-weight:500;font-size:20px}
.tag{display:inline-block;font-size:18px;padding:3px 10px;border-radius:6px;background:var(--card2);color:var(--mu)}
body{padding-top:96px}.nav{position:absolute;left:100px;right:100px;top:22px;display:flex;gap:10px}
.nv{border-top:4px solid #2E3238;padding-top:6px}.nv.past{border-color:#58C4DD66}.nv.cur{border-color:var(--c)}
.nl{font-size:16px;color:#6E757C;white-space:nowrap}.nv.past .nl{color:#8A9199}.nv.cur .nl{color:var(--c);font-weight:700}
.take{position:absolute;left:100px;right:100px;bottom:70px;font:900 30px "Noto Sans SC";border-top:2px solid #2E3238;padding-top:18px}.take i{font-style:normal;color:var(--yl)}
.foot{bottom:28px}.n{font-size:22px;line-height:1.7}.n b{display:block;font-size:26px;margin-bottom:8px}
.stp{font:700 22px "Noto Sans SC";color:var(--mu);margin-bottom:10px}.stp b{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--card2);color:var(--fg);align-items:center;justify-content:center;margin-right:8px;font-size:20px}.fig{position:absolute;left:0;top:0;font-family:"Noto Sans SC",sans-serif}.fig .m{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none}</style></head><body><div class="nav"><div class="nv past" style="flex:4.5;--c:var(--fg)"><div class="nl">输入输出</div></div><div class="nv past" style="flex:5.5;--c:var(--yl)"><div class="nl">训练目标</div></div><div class="nv past" style="flex:4.5;--c:var(--pu)"><div class="nl">经典两段</div></div><div class="nv past" style="flex:9.5;--c:var(--bl)"><div class="nl">预训练</div></div><div class="nv cur" style="flex:7.5;--c:var(--gr)"><div class="nl">后训练 · 2/5</div></div><div class="nv" style="flex:6.5;--c:var(--rd)"><div class="nl">强化学习</div></div><div class="nv" style="flex:4.5;--c:var(--fg)"><div class="nl">总结</div></div></div><h1>从 SFT 开始分叉：<span class="gr">Instruct</span> 直接答，<span class="pu">Thinking</span> 先想再答</h1><div class="sub">有的场景要快，有的题要多想几步。Qwen3-VL 把 SFT 数据分成两种格式：普通格式训出 Instruct，带思考过程的格式训出 Thinking。Thinking 的数据还专门删掉「不看图也能做对」的题，逼它真去看图。</div><svg class="fig" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="abl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#58C4DD"/></marker><marker id="ayl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FFE066"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5CD0B3"/></marker><marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FC6255"/></marker><marker id="apu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B189F5"/></marker><marker id="amu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9AA0A6"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ECECEC"/></marker><marker id="adk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5F666E"/></marker><marker id="aln" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2E3238"/></marker><marker id="acard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#202328"/></marker><marker id="acard2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#272B31"/></marker><marker id="abg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#16181B"/></marker><marker id="asv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C9CDD2"/></marker></defs><g transform="translate(0,0)"><svg x="100" y="330" width="160" height="142" viewBox="0 0 360 320" preserveAspectRatio="xMidYMid slice"><image href="../assets/cat.png" width="360" height="320"/></svg><text x="280" y="380" fill="#ECECEC" font-size="24" font-weight="700" text-anchor="start" opacity="1"><tspan x="280" dy="0">问：图里的猫在看哪边？</tspan></text><rect x="100" y="500" width="700" height="130" rx="16" fill="#202328" opacity="1" stroke="#5CD0B3" stroke-width="3"/><text x="126" y="546" fill="#5CD0B3" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="126" dy="0">Instruct 格式</tspan></text><text x="126" y="588" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="126" dy="0">「正前方，直视镜头。」</tspan></text><rect x="100" y="650" width="700" height="210" rx="16" fill="#202328" opacity="1" stroke="#B189F5" stroke-width="3"/><text x="126" y="696" fill="#B189F5" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="126" dy="0">Thinking 格式（思维链）</tspan></text><text x="126" y="738" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="126" dy="0">「&lt;think&gt;两只眼睛都在画面中间，瞳孔朝前，</tspan><tspan x="126" dy="33">脸没有偏向左右……所以是看着镜头。&lt;/think&gt;</tspan><tspan x="126" dy="33">正前方，直视镜头。」</tspan></text><text x="100" y="900" fill="#5F666E" font-size="18" font-weight="400" text-anchor="start" opacity="1"><tspan x="100" dy="0">（示意例子）SFT 数据按这两种格式分开，分别训出两个版本。</tspan></text><text x="900" y="330" fill="#B189F5" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="900" dy="0">Thinking 版另有一份「长思维链冷启动」数据</tspan></text><text x="900" y="372" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="900" dy="0">先用示范把「先想再答」的习惯教会，后面强化学习才有东西可练。</tspan></text><text x="900" y="410" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="900" dy="0">图文 : 纯文本 ≈ 1 : 1；图文侧加重理科和智能体任务。</tspan></text><rect x="900" y="466" width="920" height="130" rx="14" fill="#B189F51F" opacity="1" stroke="#B189F5" stroke-width="2"/><circle cx="936" cy="506" r="17" fill="#B189F5"/><text x="936" y="513" fill="#16181B" font-size="20" font-weight="900" text-anchor="middle" opacity="1"><tspan x="936" dy="0">1</tspan></text><text x="966" y="514" fill="#B189F5" font-size="24" font-weight="900" text-anchor="start" opacity="1"><tspan x="966" dy="0">留难题</tspan></text><text x="966" y="552" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="start" opacity="1"><tspan x="966" dy="0">基线模型通过率低、或回答更长的题才留下</tspan></text><rect x="930" y="612" width="860" height="130" rx="14" fill="#B189F51F" opacity="1" stroke="#B189F5" stroke-width="2"/><circle cx="966" cy="652" r="17" fill="#B189F5"/><text x="966" y="659" fill="#16181B" font-size="20" font-weight="900" text-anchor="middle" opacity="1"><tspan x="966" dy="0">2</tspan></text><text x="996" y="660" fill="#B189F5" font-size="24" font-weight="900" text-anchor="start" opacity="1"><tspan x="996" dy="0">必须看图</tspan></text><text x="996" y="698" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="start" opacity="1"><tspan x="996" dy="0">视觉数学题先让 Qwen3-30B（不思考模式）</tspan></text><text x="996" y="724" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="start" opacity="1"><tspan x="996" dy="0">不看图做一遍，做对了就删</tspan></text><rect x="960" y="758" width="800" height="130" rx="14" fill="#B189F51F" opacity="1" stroke="#B189F5" stroke-width="2"/><circle cx="996" cy="798" r="17" fill="#B189F5"/><text x="996" y="805" fill="#16181B" font-size="20" font-weight="900" text-anchor="middle" opacity="1"><tspan x="996" dy="0">3</tspan></text><text x="1026" y="806" fill="#B189F5" font-size="24" font-weight="900" text-anchor="start" opacity="1"><tspan x="1026" dy="0">回答要干净</tspan></text><text x="1026" y="844" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="start" opacity="1"><tspan x="1026" dy="0">删答案错的、重复的、中英混杂的、</tspan></text><text x="1026" y="870" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="start" opacity="1"><tspan x="1026" dy="0">没推理就直接猜的</tspan></text></g></svg><div class="take">「不看图也能做对」的题<i>要删掉</i>，否则它学会的是猜</div><div class="foot">来源：Qwen3-VL 技术报告 arXiv 2511.21631 §4.1、§4.2.2（p9、p11）</div></body></html>
