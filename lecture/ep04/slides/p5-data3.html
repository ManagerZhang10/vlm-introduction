<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>p5-data3</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#16181B;--card:#202328;--card2:#272B31;--fg:#ECECEC;--mu:#9AA0A6;--bl:#58C4DD;--yl:#FFE066;--gr:#5CD0B3;--rd:#FC6255;--pu:#B189F5}
html,body{margin:0;background:#16181B}*{box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);font-family:"Noto Sans SC",sans-serif;padding:72px 100px;-webkit-font-smoothing:antialiased;text-wrap:pretty}
h1{font:900 54px/1.25 "Noto Sans SC";margin:0;letter-spacing:.01em}
.sub{font-size:25px;color:var(--mu);margin-top:14px;line-height:1.5;max-width:1600px}
.bl{color:var(--bl)}.yl{color:var(--yl)}.gr{color:var(--gr)}.rd{color:var(--rd)}.pu{color:var(--pu)}.mu{color:var(--mu)}
.mono,.chip{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
.card{background:var(--card);border-radius:18px;padding:26px 30px}
.vec{display:inline-flex;gap:4px;vertical-align:middle}.vec i{width:18px;height:18px;display:block;border-radius:4px}
.vcol{display:inline-flex;flex-direction:column;gap:4px;vertical-align:middle}.vcol i{width:34px;height:12px;display:block;border-radius:3px}
.ar{color:#5F666E;font-size:40px;display:flex;align-items:center;justify-content:center}
.foot{position:absolute;left:100px;bottom:40px;font-size:18px;color:#6E757C}
.cat{display:block;object-fit:cover;border-radius:12px}
.chip{display:inline-block;font:500 22px Menlo,"SF Mono",monospace;padding:6px 12px;border-radius:8px;margin:4px}
table{border-collapse:collapse;width:100%}
td,th{padding:14px 18px;text-align:left;font-size:23px;border-bottom:1px solid #2E3238}
th{color:var(--mu);font-weight:500;font-size:20px}
.tag{display:inline-block;font-size:18px;padding:3px 10px;border-radius:6px;background:var(--card2);color:var(--mu)}
body{padding-top:96px}.nav{position:absolute;left:100px;right:100px;top:22px;display:flex;gap:10px}
.nv{border-top:4px solid #2E3238;padding-top:6px}.nv.past{border-color:#58C4DD66}.nv.cur{border-color:var(--c)}
.nl{font-size:16px;color:#6E757C;white-space:nowrap}.nv.past .nl{color:#8A9199}.nv.cur .nl{color:var(--c);font-weight:700}
.take{position:absolute;left:100px;right:100px;bottom:70px;font:900 30px "Noto Sans SC";border-top:2px solid #2E3238;padding-top:18px}.take i{font-style:normal;color:var(--yl)}
.foot{bottom:28px}.n{font-size:22px;line-height:1.7}.n b{display:block;font-size:26px;margin-bottom:8px}
.stp{font:700 22px "Noto Sans SC";color:var(--mu);margin-bottom:10px}.stp b{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--card2);color:var(--fg);align-items:center;justify-content:center;margin-right:8px;font-size:20px}.fig{position:absolute;left:0;top:0;font-family:"Noto Sans SC",sans-serif}.fig .m{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none}</style></head><body><div class="nav"><div class="nv past" style="flex:4.5;--c:var(--fg)"><div class="nl">输入输出</div></div><div class="nv past" style="flex:5.5;--c:var(--yl)"><div class="nl">训练目标</div></div><div class="nv past" style="flex:4.5;--c:var(--pu)"><div class="nl">经典两段</div></div><div class="nv cur" style="flex:9.5;--c:var(--bl)"><div class="nl">预训练 · 6/7</div></div><div class="nv" style="flex:7.5;--c:var(--gr)"><div class="nl">后训练</div></div><div class="nv" style="flex:6.5;--c:var(--rd)"><div class="nl">强化学习</div></div><div class="nv" style="flex:4.5;--c:var(--fg)"><div class="nl">总结</div></div></div><h1>1 万亿 token 从哪来（三）：<span class="bl">视频、理科、代码和智能体</span></h1><div class="sub">视频要知道「几秒发生了什么」，理科要会读图做题，智能体要会操作界面、调用工具。这些数据大多也是合成的：程序渲染、强模型写答案、再验证筛选。</div><svg class="fig" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="abl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#58C4DD"/></marker><marker id="ayl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FFE066"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5CD0B3"/></marker><marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FC6255"/></marker><marker id="apu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B189F5"/></marker><marker id="amu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9AA0A6"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ECECEC"/></marker><marker id="adk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5F666E"/></marker><marker id="aln" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2E3238"/></marker><marker id="acard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#202328"/></marker><marker id="acard2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#272B31"/></marker><marker id="abg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#16181B"/></marker><marker id="asv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C9CDD2"/></marker></defs><g transform="translate(0,0)"><rect x="100" y="320" width="560" height="560" rx="16" fill="#202328" opacity="1" stroke="#58C4DD" stroke-width="2"/><text x="130" y="372" fill="#58C4DD" font-size="28" font-weight="900" text-anchor="start" opacity="1"><tspan x="130" dy="0">视频</tspan></text><circle cx="138" cy="422" r="6" fill="#58C4DD"/><text x="158" y="430" fill="#C9CDD2" font-size="21" font-weight="400" text-anchor="start" opacity="1"><tspan x="158" dy="0">由短到长合成「带时间戳」的故事级描述</tspan></text><circle cx="138" cy="518" r="6" fill="#58C4DD"/><text x="158" y="526" fill="#C9CDD2" font-size="21" font-weight="400" text-anchor="start" opacity="1"><tspan x="158" dy="0">对象、动作、人物的时空定位标注</tspan></text><circle cx="138" cy="614" r="6" fill="#58C4DD"/><text x="158" y="622" fill="#C9CDD2" font-size="21" font-weight="400" text-anchor="start" opacity="1"><tspan x="158" dy="0">按标题、时长、类别平衡来源</tspan></text><circle cx="138" cy="710" r="6" fill="#58C4DD"/><text x="158" y="718" fill="#C9CDD2" font-size="21" font-weight="400" text-anchor="start" opacity="1"><tspan x="158" dy="0">按序列长度调每秒帧数和最大帧数</tspan></text><rect x="700" y="320" width="560" height="560" rx="16" fill="#202328" opacity="1" stroke="#FFE066" stroke-width="2"/><text x="730" y="372" fill="#FFE066" font-size="28" font-weight="900" text-anchor="start" opacity="1"><tspan x="730" dy="0">理科（STEM）</tspan></text><circle cx="738" cy="422" r="6" fill="#FFE066"/><text x="758" y="430" fill="#C9CDD2" font-size="21" font-weight="400" text-anchor="start" opacity="1"><tspan x="758" dy="0">程序渲染几何图：100 万点定位</tspan></text><circle cx="738" cy="518" r="6" fill="#FFE066"/><text x="758" y="526" fill="#C9CDD2" font-size="21" font-weight="400" text-anchor="start" opacity="1"><tspan x="758" dy="0">200 万道看图感知题、600 万条图表描述</tspan></text><circle cx="738" cy="614" r="6" fill="#FFE066"/><text x="758" y="622" fill="#C9CDD2" font-size="21" font-weight="400" text-anchor="start" opacity="1"><tspan x="758" dy="0">6000 万道中小学和大学习题</tspan></text><circle cx="738" cy="710" r="6" fill="#FFE066"/><text x="758" y="718" fill="#C9CDD2" font-size="21" font-weight="400" text-anchor="start" opacity="1"><tspan x="758" dy="0">1200 万条长思维链：强推理模型写，</tspan><tspan x="758" dy="32">规则 + 模型验证，拒绝采样只留难题</tspan></text><rect x="1300" y="320" width="560" height="560" rx="16" fill="#202328" opacity="1" stroke="#5CD0B3" stroke-width="2"/><text x="1330" y="372" fill="#5CD0B3" font-size="28" font-weight="900" text-anchor="start" opacity="1"><tspan x="1330" dy="0">代码与智能体</tspan></text><circle cx="1338" cy="422" r="6" fill="#5CD0B3"/><text x="1358" y="430" fill="#C9CDD2" font-size="21" font-weight="400" text-anchor="start" opacity="1"><tspan x="1358" dy="0">纯文本代码：沿用 Qwen3 / Qwen3-Coder</tspan></text><circle cx="1338" cy="518" r="6" fill="#5CD0B3"/><text x="1358" y="526" fill="#C9CDD2" font-size="21" font-weight="400" text-anchor="start" opacity="1"><tspan x="1358" dy="0">截图转 HTML、图转 SVG、流程图转代码</tspan></text><circle cx="1338" cy="614" r="6" fill="#5CD0B3"/><text x="1358" y="622" fill="#C9CDD2" font-size="21" font-weight="400" text-anchor="start" opacity="1"><tspan x="1358" dy="0">GUI 操作轨迹：自动生产 + 人工抽查</tspan></text><circle cx="1338" cy="710" r="6" fill="#5CD0B3"/><text x="1358" y="718" fill="#C9CDD2" font-size="21" font-weight="400" text-anchor="start" opacity="1"><tspan x="1358" dy="0">函数调用轨迹：不真执行，合成返回值</tspan></text></g></svg><div class="take">每加一种能力，就造一类<i>能验证</i>的数据</div><div class="foot">来源：Qwen3-VL 技术报告 arXiv 2511.21631 §3.2.6–3.2.9（p8–9）；视频数据量报告未写</div></body></html>
