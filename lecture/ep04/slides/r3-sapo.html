<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>r3-sapo</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#16181B;--card:#202328;--card2:#272B31;--fg:#ECECEC;--mu:#9AA0A6;--bl:#58C4DD;--yl:#FFE066;--gr:#5CD0B3;--rd:#FC6255;--pu:#B189F5}
html,body{margin:0;background:#16181B}*{box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);font-family:"Noto Sans SC",sans-serif;padding:72px 100px;-webkit-font-smoothing:antialiased;text-wrap:pretty}
h1{font:900 54px/1.25 "Noto Sans SC";margin:0;letter-spacing:.01em}
.sub{font-size:25px;color:var(--mu);margin-top:14px;line-height:1.5;max-width:1600px}
.bl{color:var(--bl)}.yl{color:var(--yl)}.gr{color:var(--gr)}.rd{color:var(--rd)}.pu{color:var(--pu)}.mu{color:var(--mu)}
.mono,.chip{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
.card{background:var(--card);border-radius:18px;padding:26px 30px}
.vec{display:inline-flex;gap:4px;vertical-align:middle}.vec i{width:18px;height:18px;display:block;border-radius:4px}
.vcol{display:inline-flex;flex-direction:column;gap:4px;vertical-align:middle}.vcol i{width:34px;height:12px;display:block;border-radius:3px}
.ar{color:#5F666E;font-size:40px;display:flex;align-items:center;justify-content:center}
.foot{position:absolute;left:100px;bottom:40px;font-size:18px;color:#6E757C}
.cat{display:block;object-fit:cover;border-radius:12px}
.chip{display:inline-block;font:500 22px Menlo,"SF Mono",monospace;padding:6px 12px;border-radius:8px;margin:4px}
table{border-collapse:collapse;width:100%}
td,th{padding:14px 18px;text-align:left;font-size:23px;border-bottom:1px solid #2E3238}
th{color:var(--mu);font-weight:500;font-size:20px}
.tag{display:inline-block;font-size:18px;padding:3px 10px;border-radius:6px;background:var(--card2);color:var(--mu)}
body{padding-top:96px}.nav{position:absolute;left:100px;right:100px;top:22px;display:flex;gap:10px}
.nv{border-top:4px solid #2E3238;padding-top:6px}.nv.past{border-color:#58C4DD66}.nv.cur{border-color:var(--c)}
.nl{font-size:16px;color:#6E757C;white-space:nowrap}.nv.past .nl{color:#8A9199}.nv.cur .nl{color:var(--c);font-weight:700}
.take{position:absolute;left:100px;right:100px;bottom:70px;font:900 30px "Noto Sans SC";border-top:2px solid #2E3238;padding-top:18px}.take i{font-style:normal;color:var(--yl)}
.foot{bottom:28px}.n{font-size:22px;line-height:1.7}.n b{display:block;font-size:26px;margin-bottom:8px}
.stp{font:700 22px "Noto Sans SC";color:var(--mu);margin-bottom:10px}.stp b{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--card2);color:var(--fg);align-items:center;justify-content:center;margin-right:8px;font-size:20px}.fig{position:absolute;left:0;top:0;font-family:"Noto Sans SC",sans-serif}.fig .m{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none}</style></head><body><div class="nav"><div class="nv past" style="flex:4.5;--c:var(--fg)"><div class="nl">输入输出</div></div><div class="nv past" style="flex:5.5;--c:var(--yl)"><div class="nl">训练目标</div></div><div class="nv past" style="flex:4.5;--c:var(--pu)"><div class="nl">经典两段</div></div><div class="nv past" style="flex:9.5;--c:var(--bl)"><div class="nl">预训练</div></div><div class="nv past" style="flex:7.5;--c:var(--gr)"><div class="nl">后训练</div></div><div class="nv cur" style="flex:6.5;--c:var(--rd)"><div class="nl">强化学习 · 3/4</div></div><div class="nv" style="flex:4.5;--c:var(--fg)"><div class="nl">总结</div></div></div><h1>SAPO：把 PPO 的<span class="rd">硬裁剪</span>换成<span class="yl">平滑的门</span></h1><div class="sub">强化学习每一步只能小步走：新策略离旧策略太远，训练容易崩。PPO / GRPO 用 clip 把概率之比卡在 [1−ε, 1+ε]，超出就不给梯度。SAPO 把这道硬墙换成随距离平滑衰减的权重。</div><svg class="fig" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="abl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#58C4DD"/></marker><marker id="ayl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FFE066"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5CD0B3"/></marker><marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FC6255"/></marker><marker id="apu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B189F5"/></marker><marker id="amu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9AA0A6"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ECECEC"/></marker><marker id="adk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5F666E"/></marker><marker id="aln" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2E3238"/></marker><marker id="acard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#202328"/></marker><marker id="acard2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#272B31"/></marker><marker id="abg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#16181B"/></marker><marker id="asv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C9CDD2"/></marker></defs><g transform="translate(0,0)"><line x1="160" y1="760" x2="940" y2="760" stroke="#C9CDD2" stroke-width="2" opacity="1" marker-end="url(#asv)"/><line x1="160" y1="760" x2="160" y2="370" stroke="#C9CDD2" stroke-width="2" opacity="1" marker-end="url(#asv)"/><text x="160.0" y="794" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="middle" opacity="1" class="m"><tspan x="160.0" dy="0">0</tspan></text><text x="413.3333333333333" y="794" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="middle" opacity="1" class="m"><tspan x="413.3333333333333" dy="0">1</tspan></text><text x="666.6666666666666" y="794" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="middle" opacity="1" class="m"><tspan x="666.6666666666666" dy="0">2</tspan></text><text x="920.0" y="794" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="middle" opacity="1" class="m"><tspan x="920.0" dy="0">3</tspan></text><text x="940" y="830" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="end" opacity="1"><tspan x="940" dy="0">新旧概率之比 r = π_新 / π_旧</tspan></text><text x="146" y="407" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="end" opacity="1" class="m"><tspan x="146" dy="0">1</tspan></text><text x="146" y="767" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="end" opacity="1" class="m"><tspan x="146" dy="0">0</tspan></text><text x="160" y="350" fill="#ECECEC" font-size="22" font-weight="700" text-anchor="start" opacity="1"><tspan x="160" dy="0">梯度权重（A > 0 的情况）</tspan></text><path d="M160.0,400 L464.0,400 L464.0,760 L920.0,760" stroke="#FC6255" stroke-width="5" fill="none" opacity="1"/><path d="M160.0,476.9 L167.6,473.0 L175.2,469.1 L182.8,465.3 L190.4,461.6 L198.0,457.9 L205.6,454.3 L213.2,450.8 L220.8,447.4 L228.4,444.0 L236.0,440.7 L243.6,437.6 L251.2,434.5 L258.8,431.5 L266.4,428.7 L274.0,425.9 L281.6,423.3 L289.2,420.8 L296.8,418.4 L304.4,416.1 L312.0,414.0 L319.6,412.0 L327.2,410.2 L334.8,408.5 L342.4,407.0 L350.0,405.6 L357.6,404.3 L365.2,403.2 L372.8,402.3 L380.4,401.5 L388.0,400.9 L395.6,400.4 L403.2,400.1 L410.8,400.0 L418.4,400.0 L426.0,400.2 L433.6,400.6 L441.2,401.1 L448.8,401.8 L456.4,402.6 L464.0,403.6 L471.6,404.7 L479.2,406.0 L486.8,407.5 L494.4,409.1 L502.0,410.8 L509.6,412.7 L517.2,414.7 L524.8,416.9 L532.4,419.2 L540.0,421.6 L547.6,424.1 L555.2,426.8 L562.8,429.6 L570.4,432.5 L578.0,435.5 L585.6,438.6 L593.2,441.8 L600.8,445.1 L608.4,448.5 L616.0,452.0 L623.6,455.5 L631.2,459.1 L638.8,462.8 L646.4,466.6 L654.0,470.4 L661.6,474.3 L669.2,478.2 L676.8,482.2 L684.4,486.2 L692.0,490.2 L699.6,494.3 L707.2,498.3 L714.8,502.5 L722.4,506.6 L730.0,510.7 L737.6,514.9 L745.2,519.0 L752.8,523.2 L760.4,527.3 L768.0,531.5 L775.6,535.6 L783.2,539.8 L790.8,543.9 L798.4,548.0 L806.0,552.0 L813.6,556.1 L821.2,560.1 L828.8,564.1 L836.4,568.0 L844.0,571.9 L851.6,575.8 L859.2,579.7 L866.8,583.5 L874.4,587.2 L882.0,590.9 L889.6,594.6 L897.2,598.2 L904.8,601.8 L912.4,605.3 L920.0,608.8" stroke="#FFE066" stroke-width="5" fill="none" opacity="1"/><text x="489.33333333333337" y="630.4" fill="#FC6255" font-size="20" font-weight="700" text-anchor="start" opacity="1"><tspan x="489.33333333333337" dy="0">PPO / GRPO 的 clip：</tspan><tspan x="489.33333333333337" dy="30">超出 1+ε 直接归零</tspan></text><text x="679.3333333333333" y="464.8" fill="#FFE066" font-size="22" font-weight="900" text-anchor="start" opacity="1"><tspan x="679.3333333333333" dy="0">SAPO：平滑衰减</tspan></text><text x="1040" y="330" fill="#FC6255" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="1040" dy="0">硬裁剪（PPO / GRPO）</tspan></text><rect x="1040" y="352" width="780" height="60" rx="10" fill="#272B31" opacity="1"/><text x="1060" y="390" fill="#ECECEC" font-size="21" font-weight="500" text-anchor="start" opacity="1" class="m"><tspan x="1060" dy="0">min( r·A,  clip(r, 1−ε, 1+ε)·A )</tspan></text><text x="1040" y="446" fill="#C9CDD2" font-size="21" font-weight="400" text-anchor="start" opacity="1"><tspan x="1040" dy="0">某个字的概率变化超出范围，它的梯度就一刀切成 0。</tspan></text><text x="1040" y="530" fill="#FFE066" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="1040" dy="0">软门控（SAPO）</tspan></text><rect x="1040" y="552" width="780" height="100" rx="10" fill="#272B31" opacity="1"/><text x="1060" y="590" fill="#ECECEC" font-size="21" font-weight="500" text-anchor="start" opacity="1" class="m"><tspan x="1060" dy="0">f(r) = σ( τ·(r − 1) ) · 4/τ　替代 clip</tspan></text><text x="1060" y="630" fill="#ECECEC" font-size="21" font-weight="500" text-anchor="start" opacity="1" class="m"><tspan x="1060" dy="0">梯度权重 = sech²( τ/2 · (r − 1) )，r = 1 时恰好为 1</tspan></text><text x="1040" y="690" fill="#C9CDD2" font-size="21" font-weight="400" text-anchor="start" opacity="1"><tspan x="1040" dy="0">离 1 越远权重越小，但不突然归零；目标里没有 KL 项。</tspan></text><text x="1040" y="728" fill="#C9CDD2" font-size="21" font-weight="400" text-anchor="start" opacity="1"><tspan x="1040" dy="0">负优势用更大的温度：τ_neg = 1.05 > τ_pos = 1.0，衰减更快。</tspan></text><text x="1040" y="790" fill="#C9CDD2" font-size="21" font-weight="400" text-anchor="start" opacity="1"><tspan x="1040" dy="0">论文结论：GSPO、GRPO-R2 训练早期就崩，SAPO 稳定、</tspan></text><text x="1040" y="826" fill="#C9CDD2" font-size="21" font-weight="400" text-anchor="start" opacity="1"><tspan x="1040" dy="0">最终分更高；Qwen3-VL 的强化学习用的就是它。</tspan></text></g></svg><div class="take"><i>硬墙变软坡</i>：既防止步子太大，又不把有用的梯度全扔掉</div><div class="foot">SAPO arXiv 2511.20347 p3–p8（式、温度取值与消融）；Qwen3-VL 报告 §4.4.1。曲线按 τ = 1、ε = 0.2 画</div></body></html>
