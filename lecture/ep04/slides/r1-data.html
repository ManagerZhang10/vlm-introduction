<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>r1-data</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#16181B;--card:#202328;--card2:#272B31;--fg:#ECECEC;--mu:#9AA0A6;--bl:#58C4DD;--yl:#FFE066;--gr:#5CD0B3;--rd:#FC6255;--pu:#B189F5}
html,body{margin:0;background:#16181B}*{box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);font-family:"Noto Sans SC",sans-serif;padding:72px 100px;-webkit-font-smoothing:antialiased;text-wrap:pretty}
h1{font:900 54px/1.25 "Noto Sans SC";margin:0;letter-spacing:.01em}
.sub{font-size:25px;color:var(--mu);margin-top:14px;line-height:1.5;max-width:1600px}
.bl{color:var(--bl)}.yl{color:var(--yl)}.gr{color:var(--gr)}.rd{color:var(--rd)}.pu{color:var(--pu)}.mu{color:var(--mu)}
.mono,.chip{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
.card{background:var(--card);border-radius:18px;padding:26px 30px}
.vec{display:inline-flex;gap:4px;vertical-align:middle}.vec i{width:18px;height:18px;display:block;border-radius:4px}
.vcol{display:inline-flex;flex-direction:column;gap:4px;vertical-align:middle}.vcol i{width:34px;height:12px;display:block;border-radius:3px}
.ar{color:#5F666E;font-size:40px;display:flex;align-items:center;justify-content:center}
.foot{position:absolute;left:100px;bottom:40px;font-size:18px;color:#6E757C}
.cat{display:block;object-fit:cover;border-radius:12px}
.chip{display:inline-block;font:500 22px Menlo,"SF Mono",monospace;padding:6px 12px;border-radius:8px;margin:4px}
table{border-collapse:collapse;width:100%}
td,th{padding:14px 18px;text-align:left;font-size:23px;border-bottom:1px solid #2E3238}
th{color:var(--mu);font-weight:500;font-size:20px}
.tag{display:inline-block;font-size:18px;padding:3px 10px;border-radius:6px;background:var(--card2);color:var(--mu)}
body{padding-top:96px}.nav{position:absolute;left:100px;right:100px;top:22px;display:flex;gap:10px}
.nv{border-top:4px solid #2E3238;padding-top:6px}.nv.past{border-color:#58C4DD66}.nv.cur{border-color:var(--c)}
.nl{font-size:16px;color:#6E757C;white-space:nowrap}.nv.past .nl{color:#8A9199}.nv.cur .nl{color:var(--c);font-weight:700}
.take{position:absolute;left:100px;right:100px;bottom:70px;font:900 30px "Noto Sans SC";border-top:2px solid #2E3238;padding-top:18px}.take i{font-style:normal;color:var(--yl)}
.foot{bottom:28px}.n{font-size:22px;line-height:1.7}.n b{display:block;font-size:26px;margin-bottom:8px}
.stp{font:700 22px "Noto Sans SC";color:var(--mu);margin-bottom:10px}.stp b{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--card2);color:var(--fg);align-items:center;justify-content:center;margin-right:8px;font-size:20px}.fig{position:absolute;left:0;top:0;font-family:"Noto Sans SC",sans-serif}.fig .m{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none}</style></head><body><div class="nav"><div class="nv past" style="flex:4.5;--c:var(--fg)"><div class="nl">输入输出</div></div><div class="nv past" style="flex:5.5;--c:var(--yl)"><div class="nl">训练目标</div></div><div class="nv past" style="flex:4.5;--c:var(--pu)"><div class="nl">经典两段</div></div><div class="nv past" style="flex:9.5;--c:var(--bl)"><div class="nl">预训练</div></div><div class="nv past" style="flex:6.5;--c:var(--gr)"><div class="nl">后训练</div></div><div class="nv cur" style="flex:6.5;--c:var(--rd)"><div class="nl">强化学习 · 1/4</div></div><div class="nv" style="flex:4.5;--c:var(--fg)"><div class="nl">总结</div></div></div><h1>推理强化学习：<span class="rd">选题</span>比算法更费功夫</h1><div class="sub">SFT 只能模仿示范，强化学习让模型自己做题、按对错调整。前提是每道题都能自动判对错，而且难度要刚好：全错学不到，全对也学不到。</div><svg class="fig" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="abl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#58C4DD"/></marker><marker id="ayl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FFE066"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5CD0B3"/></marker><marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FC6255"/></marker><marker id="apu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B189F5"/></marker><marker id="amu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9AA0A6"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ECECEC"/></marker><marker id="adk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5F666E"/></marker><marker id="aln" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2E3238"/></marker><marker id="acard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#202328"/></marker><marker id="acard2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#272B31"/></marker><marker id="abg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#16181B"/></marker><marker id="asv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C9CDD2"/></marker></defs><g transform="translate(0,0)"><rect x="100.0" y="320" width="1720" height="92" rx="14" fill="#FC62551F" opacity="1" stroke="#FC6255" stroke-width="2"/><text x="130.0" y="374" fill="#FC6255" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="130.0" dy="0">题源</tspan></text><text x="1790.0" y="360" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="end" opacity="1"><tspan x="1790.0" dy="0">开源 + 自有题目</tspan></text><text x="1790.0" y="390" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="end" opacity="1"><tspan x="1790.0" dy="0">人工标注、预处理</tspan></text><rect x="180.0" y="428" width="1560" height="92" rx="14" fill="#FC62551F" opacity="1" stroke="#FC6255" stroke-width="2"/><text x="210.0" y="482" fill="#FC6255" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="210.0" dy="0">先用最强的模型试</tspan></text><text x="1710.0" y="468" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="end" opacity="1"><tspan x="1710.0" dy="0">Qwen3-VL-235B 早期版本</tspan></text><text x="1710.0" y="498" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="end" opacity="1"><tspan x="1710.0" dy="0">每题答 16 次，全错就删</tspan></text><rect x="260.0" y="536" width="1400" height="92" rx="14" fill="#FC62551F" opacity="1" stroke="#FC6255" stroke-width="2"/><text x="290.0" y="590" fill="#FC6255" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="290.0" dy="0">按任务试跑</tspan></text><text x="1630.0" y="576" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="end" opacity="1"><tspan x="1630.0" dy="0">每个任务小规模 RL，</tspan></text><text x="1630.0" y="606" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="end" opacity="1"><tspan x="1630.0" dy="0">删掉提升空间小的题源</tspan></text><rect x="340.0" y="644" width="1240" height="92" rx="14" fill="#FFE0661F" opacity="1" stroke="#FFE066" stroke-width="2"/><text x="370.0" y="698" fill="#FFE066" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="370.0" dy="0">约 3 万题</tspan></text><text x="1550.0" y="684" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="end" opacity="1"><tspan x="1550.0" dy="0">数学、代码、逻辑、</tspan></text><text x="1550.0" y="714" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="end" opacity="1"><tspan x="1550.0" dy="0">视觉定位、视觉谜题</tspan></text><rect x="420.0" y="752" width="1080" height="92" rx="14" fill="#FC62551F" opacity="1" stroke="#FC6255" stroke-width="2"/><text x="450.0" y="806" fill="#FC6255" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="450.0" dy="0">训每个模型前再筛</tspan></text><text x="1470.0" y="792" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="end" opacity="1"><tspan x="1470.0" dy="0">用该模型答 16 次，</tspan></text><text x="1470.0" y="822" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="end" opacity="1"><tspan x="1470.0" dy="0">通过率 > 90% 的删</tspan></text><text x="100" y="878" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="100" dy="0">每道题都能用<tspan fill="#FFE066" font-weight="900">规则或代码</tspan>判对错。格式靠提示词约束，不单独给格式奖励；回答语言和提问不一致要扣分。各任务按固定比例混成 batch。</tspan></text></g></svg><div class="take">留下的是<i>有时对、有时错</i>的题</div><div class="foot">来源：Qwen3-VL 技术报告 arXiv 2511.21631 §4.4.1（p11–12）</div></body></html>
