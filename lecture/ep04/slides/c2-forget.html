<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>c2-forget</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#16181B;--card:#202328;--card2:#272B31;--fg:#ECECEC;--mu:#9AA0A6;--bl:#58C4DD;--yl:#FFE066;--gr:#5CD0B3;--rd:#FC6255;--pu:#B189F5}
html,body{margin:0;background:#16181B}*{box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);font-family:"Noto Sans SC",sans-serif;padding:72px 100px;-webkit-font-smoothing:antialiased;text-wrap:pretty}
h1{font:900 54px/1.25 "Noto Sans SC";margin:0;letter-spacing:.01em}
.sub{font-size:25px;color:var(--mu);margin-top:14px;line-height:1.5;max-width:1600px}
.bl{color:var(--bl)}.yl{color:var(--yl)}.gr{color:var(--gr)}.rd{color:var(--rd)}.pu{color:var(--pu)}.mu{color:var(--mu)}
.mono,.chip{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
.card{background:var(--card);border-radius:18px;padding:26px 30px}
.vec{display:inline-flex;gap:4px;vertical-align:middle}.vec i{width:18px;height:18px;display:block;border-radius:4px}
.vcol{display:inline-flex;flex-direction:column;gap:4px;vertical-align:middle}.vcol i{width:34px;height:12px;display:block;border-radius:3px}
.ar{color:#5F666E;font-size:40px;display:flex;align-items:center;justify-content:center}
.foot{position:absolute;left:100px;bottom:40px;font-size:18px;color:#6E757C}
.cat{display:block;object-fit:cover;border-radius:12px}
.chip{display:inline-block;font:500 22px Menlo,"SF Mono",monospace;padding:6px 12px;border-radius:8px;margin:4px}
table{border-collapse:collapse;width:100%}
td,th{padding:14px 18px;text-align:left;font-size:23px;border-bottom:1px solid #2E3238}
th{color:var(--mu);font-weight:500;font-size:20px}
.tag{display:inline-block;font-size:18px;padding:3px 10px;border-radius:6px;background:var(--card2);color:var(--mu)}
body{padding-top:96px}.nav{position:absolute;left:100px;right:100px;top:22px;display:flex;gap:10px}
.nv{border-top:4px solid #2E3238;padding-top:6px}.nv.past{border-color:#58C4DD66}.nv.cur{border-color:var(--c)}
.nl{font-size:16px;color:#6E757C;white-space:nowrap}.nv.past .nl{color:#8A9199}.nv.cur .nl{color:var(--c);font-weight:700}
.take{position:absolute;left:100px;right:100px;bottom:70px;font:900 30px "Noto Sans SC";border-top:2px solid #2E3238;padding-top:18px}.take i{font-style:normal;color:var(--yl)}
.foot{bottom:28px}.n{font-size:22px;line-height:1.7}.n b{display:block;font-size:26px;margin-bottom:8px}
.stp{font:700 22px "Noto Sans SC";color:var(--mu);margin-bottom:10px}.stp b{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--card2);color:var(--fg);align-items:center;justify-content:center;margin-right:8px;font-size:20px}.fig{position:absolute;left:0;top:0;font-family:"Noto Sans SC",sans-serif}.fig .m{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none}</style></head><body><div class="nav"><div class="nv past" style="flex:4.5;--c:var(--fg)"><div class="nl">输入输出</div></div><div class="nv past" style="flex:5.5;--c:var(--yl)"><div class="nl">训练目标</div></div><div class="nv cur" style="flex:4.5;--c:var(--pu)"><div class="nl">经典两段 · 2/2</div></div><div class="nv" style="flex:9.5;--c:var(--bl)"><div class="nl">预训练</div></div><div class="nv" style="flex:7.5;--c:var(--gr)"><div class="nl">后训练</div></div><div class="nv" style="flex:6.5;--c:var(--rd)"><div class="nl">强化学习</div></div><div class="nv" style="flex:4.5;--c:var(--fg)"><div class="nl">总结</div></div></div><h1>放开大模型一起训，<span class="rd">原来的语言能力可能被冲掉</span></h1><div class="sub">全参训练能把看图练得更好，但大模型的参数也跟着改。如果喂的全是图文，原来写文章、做推理的能力没人练，就会退化（灾难性遗忘）。下面是一个玩具实验，把这个张力量出来。</div><svg class="fig" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="abl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#58C4DD"/></marker><marker id="ayl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FFE066"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5CD0B3"/></marker><marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FC6255"/></marker><marker id="apu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B189F5"/></marker><marker id="amu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9AA0A6"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ECECEC"/></marker><marker id="adk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5F666E"/></marker><marker id="aln" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2E3238"/></marker><marker id="acard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#202328"/></marker><marker id="acard2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#272B31"/></marker><marker id="abg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#16181B"/></marker><marker id="asv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C9CDD2"/></marker></defs><g transform="translate(0,0)"><text x="100" y="340" fill="#5CD0B3" font-size="24" font-weight="900" text-anchor="start" opacity="1"><tspan x="100" dy="0">多模态准确率（越高越好）</tspan></text><text x="100" y="416" fill="#ECECEC" font-size="22" font-weight="700" text-anchor="start" opacity="1"><tspan x="100" dy="0">只训投影层</tspan></text><text x="100" y="448" fill="#9AA0A6" font-size="18" font-weight="400" text-anchor="start" opacity="1"><tspan x="100" dy="0">可训参数 6%</tspan></text><rect x="330" y="390" width="290" height="44" rx="6" fill="#5CD0B3" opacity="0.85"/><text x="630" y="422" fill="#5CD0B3" font-size="24" font-weight="900" text-anchor="start" opacity="1" class="m"><tspan x="630" dy="0">58%</tspan></text><text x="100" y="526" fill="#ECECEC" font-size="22" font-weight="700" text-anchor="start" opacity="1"><tspan x="100" dy="0">投影层 + LLM</tspan></text><text x="100" y="558" fill="#9AA0A6" font-size="18" font-weight="400" text-anchor="start" opacity="1"><tspan x="100" dy="0">可训参数 86%</tspan></text><rect x="330" y="500" width="460" height="44" rx="6" fill="#5CD0B3" opacity="0.85"/><text x="800" y="532" fill="#5CD0B3" font-size="24" font-weight="900" text-anchor="start" opacity="1" class="m"><tspan x="800" dy="0">92%</tspan></text><text x="100" y="636" fill="#ECECEC" font-size="22" font-weight="700" text-anchor="start" opacity="1"><tspan x="100" dy="0">全参数</tspan></text><text x="100" y="668" fill="#9AA0A6" font-size="18" font-weight="400" text-anchor="start" opacity="1"><tspan x="100" dy="0">可训参数 100%</tspan></text><rect x="330" y="610" width="350" height="44" rx="6" fill="#5CD0B3" opacity="0.85"/><text x="690" y="642" fill="#5CD0B3" font-size="24" font-weight="900" text-anchor="start" opacity="1" class="m"><tspan x="690" dy="0">70%</tspan></text><text x="960" y="340" fill="#FC6255" font-size="24" font-weight="900" text-anchor="start" opacity="1"><tspan x="960" dy="0">纯文本 loss（越低越好）</tspan></text><text x="960" y="416" fill="#ECECEC" font-size="22" font-weight="700" text-anchor="start" opacity="1"><tspan x="960" dy="0">只训投影层</tspan></text><rect x="1160" y="390" width="32.751999999999995" height="44" rx="6" fill="#5CD0B3" opacity="0.85"/><text x="1202.752" y="422" fill="#5CD0B3" font-size="24" font-weight="900" text-anchor="start" opacity="1" class="m"><tspan x="1202.752" dy="0">0.356</tspan></text><text x="960" y="526" fill="#ECECEC" font-size="22" font-weight="700" text-anchor="start" opacity="1"><tspan x="960" dy="0">投影层 + LLM</tspan></text><rect x="1160" y="500" width="464.232" height="44" rx="6" fill="#FC6255" opacity="0.85"/><text x="1634.232" y="532" fill="#FC6255" font-size="24" font-weight="900" text-anchor="start" opacity="1" class="m"><tspan x="1634.232" dy="0">5.046</tspan></text><text x="960" y="636" fill="#ECECEC" font-size="22" font-weight="700" text-anchor="start" opacity="1"><tspan x="960" dy="0">全参数</tspan></text><rect x="1160" y="610" width="543.996" height="44" rx="6" fill="#FC6255" opacity="0.85"/><text x="1713.996" y="642" fill="#FC6255" font-size="24" font-weight="900" text-anchor="start" opacity="1" class="m"><tspan x="1713.996" dy="0">5.913</tspan></text><line x1="1440.1399999999999" y1="370" x2="1440.1399999999999" y2="720" stroke="#FFE066" stroke-width="3" opacity="1" stroke-dasharray="8 6"/><text x="1440.1399999999999" y="750" fill="#FFE066" font-size="20" font-weight="700" text-anchor="middle" opacity="1"><tspan x="1440.1399999999999" dy="0">随机猜 = ln 21 ≈ 3.05</tspan></text><line x1="1192.844" y1="370" x2="1192.844" y2="720" stroke="#9AA0A6" stroke-width="2" opacity="1" stroke-dasharray="4 6"/><text x="1186.844" y="780" fill="#9AA0A6" font-size="20" font-weight="400" text-anchor="middle" opacity="1"><tspan x="1186.844" dy="0">训前 0.357</tspan></text><text x="100" y="830" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="100" dy="0">玩具设置：195K 参数（tiny ViT + 投影层 + tiny GPT），先把 LLM 在纯文本语法上训会，再只用图文数据各训 400 步，</tspan></text><text x="100" y="866" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="100" dy="0"><tspan fill="#FC6255" font-weight="900">没有混纯文本</tspan>。放开 LLM 以后纯文本 loss 超过了随机猜。它只说明风险存在，不能推出 8B 模型会忘多少。</tspan></text></g></svg><div class="take">Qwen3-VL 的对策：每一段都<i>混纯文本</i>——S1 混入，S2 加大比例，SFT 占三分之一</div><div class="foot">来源：vlm-14days track_a day08 实测（玩具模型）</div></body></html>
