<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>f1-sft</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#16181B;--card:#202328;--card2:#272B31;--fg:#ECECEC;--mu:#9AA0A6;--bl:#58C4DD;--yl:#FFE066;--gr:#5CD0B3;--rd:#FC6255;--pu:#B189F5}
html,body{margin:0;background:#16181B}*{box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);font-family:"Noto Sans SC",sans-serif;padding:72px 100px;-webkit-font-smoothing:antialiased;text-wrap:pretty}
h1{font:900 54px/1.25 "Noto Sans SC";margin:0;letter-spacing:.01em}
.sub{font-size:25px;color:var(--mu);margin-top:14px;line-height:1.5;max-width:1600px}
.bl{color:var(--bl)}.yl{color:var(--yl)}.gr{color:var(--gr)}.rd{color:var(--rd)}.pu{color:var(--pu)}.mu{color:var(--mu)}
.mono,.chip{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
.card{background:var(--card);border-radius:18px;padding:26px 30px}
.vec{display:inline-flex;gap:4px;vertical-align:middle}.vec i{width:18px;height:18px;display:block;border-radius:4px}
.vcol{display:inline-flex;flex-direction:column;gap:4px;vertical-align:middle}.vcol i{width:34px;height:12px;display:block;border-radius:3px}
.ar{color:#5F666E;font-size:40px;display:flex;align-items:center;justify-content:center}
.foot{position:absolute;left:100px;bottom:40px;font-size:18px;color:#6E757C}
.cat{display:block;object-fit:cover;border-radius:12px}
.chip{display:inline-block;font:500 22px Menlo,"SF Mono",monospace;padding:6px 12px;border-radius:8px;margin:4px}
table{border-collapse:collapse;width:100%}
td,th{padding:14px 18px;text-align:left;font-size:23px;border-bottom:1px solid #2E3238}
th{color:var(--mu);font-weight:500;font-size:20px}
.tag{display:inline-block;font-size:18px;padding:3px 10px;border-radius:6px;background:var(--card2);color:var(--mu)}
body{padding-top:96px}.nav{position:absolute;left:100px;right:100px;top:22px;display:flex;gap:10px}
.nv{border-top:4px solid #2E3238;padding-top:6px}.nv.past{border-color:#58C4DD66}.nv.cur{border-color:var(--c)}
.nl{font-size:16px;color:#6E757C;white-space:nowrap}.nv.past .nl{color:#8A9199}.nv.cur .nl{color:var(--c);font-weight:700}
.take{position:absolute;left:100px;right:100px;bottom:70px;font:900 30px "Noto Sans SC";border-top:2px solid #2E3238;padding-top:18px}.take i{font-style:normal;color:var(--yl)}
.foot{bottom:28px}.n{font-size:22px;line-height:1.7}.n b{display:block;font-size:26px;margin-bottom:8px}
.stp{font:700 22px "Noto Sans SC";color:var(--mu);margin-bottom:10px}.stp b{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--card2);color:var(--fg);align-items:center;justify-content:center;margin-right:8px;font-size:20px}.fig{position:absolute;left:0;top:0;font-family:"Noto Sans SC",sans-serif}.fig .m{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none}</style></head><body><div class="nav"><div class="nv past" style="flex:4.5;--c:var(--fg)"><div class="nl">输入输出</div></div><div class="nv past" style="flex:5.5;--c:var(--yl)"><div class="nl">训练目标</div></div><div class="nv past" style="flex:4.5;--c:var(--pu)"><div class="nl">经典两段</div></div><div class="nv past" style="flex:9.5;--c:var(--bl)"><div class="nl">预训练</div></div><div class="nv cur" style="flex:6.5;--c:var(--gr)"><div class="nl">后训练 · 1/4</div></div><div class="nv" style="flex:6.5;--c:var(--rd)"><div class="nl">强化学习</div></div><div class="nv" style="flex:4.5;--c:var(--fg)"><div class="nl">总结</div></div></div><h1>SFT：预训练完只会续写，<span class="gr">用示范教它按指令回答</span></h1><div class="sub">预训练的目标是续写，问它问题，它可能接着编下一个问题。SFT（监督微调）喂「问题 → 好回答」的示范，loss 只算回答部分，让它学会对话的样子。数据量比预训练小几个数量级，所以质量全靠过滤。</div><svg class="fig" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="abl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#58C4DD"/></marker><marker id="ayl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FFE066"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5CD0B3"/></marker><marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FC6255"/></marker><marker id="apu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B189F5"/></marker><marker id="amu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9AA0A6"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ECECEC"/></marker><marker id="adk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5F666E"/></marker><marker id="aln" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2E3238"/></marker><marker id="acard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#202328"/></marker><marker id="acard2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#272B31"/></marker><marker id="abg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#16181B"/></marker><marker id="asv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C9CDD2"/></marker></defs><g transform="translate(0,0)"><text x="100" y="330" fill="#ECECEC" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="100" dy="0">约 120 万条问答示范</tspan></text><rect x="100" y="356" width="560" height="50" rx="8" fill="#FFE066" opacity="0.85"/><text x="380" y="390" fill="#16181B" font-size="22" font-weight="900" text-anchor="middle" opacity="1"><tspan x="380" dy="0">1/3 纯文本（约 40 万）</tspan></text><rect x="670" y="356" width="1150" height="50" rx="8" fill="#58C4DD" opacity="0.85"/><text x="1245" y="390" fill="#16181B" font-size="22" font-weight="900" text-anchor="middle" opacity="1"><tspan x="1245" dy="0">2/3 图文 + 视频（约 80 万）</tspan></text><text x="100" y="446" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="100" dy="0">单轮和多轮对话 · 单图和多图 · 中英为主再加多语种 · 带工具搜索、看图推理的交错样本</tspan></text><text x="100" y="520" fill="#ECECEC" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="100" dy="0">两道过滤</tspan></text><rect x="100" y="546" width="540" height="150" rx="12" fill="#202328" opacity="1" stroke="#58C4DD" stroke-width="2"/><text x="118" y="584" fill="#58C4DD" font-size="22" font-weight="900" text-anchor="start" opacity="1"><tspan x="118" dy="0">题目过滤</tspan></text><text x="118" y="618" fill="#C9CDD2" font-size="19" font-weight="400" text-anchor="start" opacity="1"><tspan x="118" dy="0">Qwen2.5-VL 删掉无法验证的题；</tspan><tspan x="118" dy="28">指令模糊的轻改；删空洞的网页题；</tspan><tspan x="118" dy="28">按难度和相关性再筛一遍</tspan></text><line x1="646" y1="621.0" x2="684" y2="621.0" stroke="#C9CDD2" stroke-width="3" opacity="1" marker-end="url(#asv)"/><rect x="690" y="546" width="540" height="150" rx="12" fill="#202328" opacity="1" stroke="#58C4DD" stroke-width="2"/><text x="708" y="584" fill="#58C4DD" font-size="22" font-weight="900" text-anchor="start" opacity="1"><tspan x="708" dy="0">规则过滤回答</tspan></text><text x="708" y="618" fill="#C9CDD2" font-size="19" font-weight="400" text-anchor="start" opacity="1"><tspan x="708" dy="0">重复、不完整、格式错；</tspan><tspan x="708" dy="28">跑题或可能有害的整条删</tspan></text><line x1="1236" y1="621.0" x2="1274" y2="621.0" stroke="#C9CDD2" stroke-width="3" opacity="1" marker-end="url(#asv)"/><rect x="1280" y="546" width="540" height="150" rx="12" fill="#202328" opacity="1" stroke="#58C4DD" stroke-width="2"/><text x="1298" y="584" fill="#58C4DD" font-size="22" font-weight="900" text-anchor="start" opacity="1"><tspan x="1298" dy="0">模型过滤回答</tspan></text><text x="1298" y="618" fill="#C9CDD2" font-size="19" font-weight="400" text-anchor="start" opacity="1"><tspan x="1298" dy="0">Qwen2.5-VL 系列奖励模型打分：</tspan><tspan x="1298" dy="28">正确、完整、清晰、有用；</tspan><tspan x="1298" dy="28">看图题重点查有没有用对图</tspan></text><text x="100" y="760" fill="#ECECEC" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="100" dy="0">训两轮</tspan></text><rect x="100" y="786" width="560" height="90" rx="12" fill="#58C4DD22" opacity="1" stroke="#58C4DD" stroke-width="2"/><text x="130" y="826" fill="#58C4DD" font-size="24" font-weight="900" text-anchor="start" opacity="1"><tspan x="130" dy="0">第 1 轮：32K</tspan></text><text x="130" y="860" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="start" opacity="1"><tspan x="130" dy="0">全部数据过一遍</tspan></text><line x1="668" y1="831" x2="712" y2="831" stroke="#C9CDD2" stroke-width="3" opacity="1" marker-end="url(#asv)"/><rect x="720" y="786" width="1100" height="90" rx="12" fill="#FFE06622" opacity="1" stroke="#FFE066" stroke-width="2"/><text x="750" y="826" fill="#FFE066" font-size="24" font-weight="900" text-anchor="start" opacity="1"><tspan x="750" dy="0">第 2 轮：256K</tspan></text><text x="750" y="860" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="start" opacity="1"><tspan x="750" dy="0">长材料和 32K 数据交错：几百页技术文档、整本教科书、最长 2 小时的视频</tspan></text></g></svg><div class="take">SFT 教的是<i>说话的方式</i>，量小但要干净</div><div class="foot">来源：Qwen3-VL 技术报告 arXiv 2511.21631 §4.1、§4.2.1（p9–11）；哪些参数在训报告没写</div></body></html>
