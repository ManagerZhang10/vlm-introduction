:root{--bg:#16181B;--card:#202328;--card2:#272B31;--fg:#ECECEC;--mu:#9AA0A6;--bl:#58C4DD;--yl:#FFE066;--gr:#5CD0B3;--rd:#FC6255;--pu:#B189F5}

ke-dasharray="8 6"/><text x="100" y="620" fill="#9AA0A6" font-size="18" font-weight="400" text-anchor="start" opacity="1"><tspan x="100" dy="0">小方块从左到右：ViT · 合并器 · 大模型（黄 = 在训，灰 = 冻结，虚线 = 报告没写）</tspan></text><path d="M100,662 L100,650 L1076,650 L1076,662" stroke="#58C4DD" stroke-width="2" fill="none" opacity="1"/><line x1="588.0" y1="650" x2="588.0" y2="638" stroke="#58C4DD" stroke-width="2" opacity="1"/><text x="588" y="700" fill="#58C4DD" font-size="22" font-weight="700" text-anchor="middle" opacity="1"><tspan x="588" dy="0">预训练：管能力，约 2.2 万亿 token</tspan></text><path d="M1100,662 L1100,650 L1826,650 L1826,662" stroke="#5CD0B3" stroke-width="2" fill="none" opacity="1"/><line x1="1463.0" y1="650" x2="1463.0" y2="638" stroke="#5CD0B3" stroke-width="2" opacity="1"/><text x="1463" y="700" fill="#5CD0B3" font-size="22" font-weight="700" text-anchor="middle" opacity="1"><tspan x="1463" dy="0">后训练：管行为，数据少但精</tspan></text><text x="100" y="790" fill="#ECECEC" font-size="24" font-weight="700" text-anchor="start" opacity="1"><tspan x="100" dy="0">贯穿始终的三件事：先接口后全参（防噪声）· 每段混纯文本（防遗忘）· 数据大多由上一代模型生成、再过滤。</tspan></text><text x="100" y="860" fill="#C9CDD2" font-size="24" font-weight="400" text-anchor="start" opacity="1"><tspan x="100" dy="0"><tspan fill="#ECECEC" font-weight="900">多模态理解的基本原理到这里讲完了。</tspan>后面我们讲生成：模型怎么画图、做视频。欢迎关注。</tspan></text></g></svg></body></html>
