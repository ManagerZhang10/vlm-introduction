<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>l1-next</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#16181B;--card:#202328;--card2:#272B31;--fg:#ECECEC;--mu:#9AA0A6;--bl:#58C4DD;--yl:#FFE066;--gr:#5CD0B3;--rd:#FC6255;--pu:#B189F5}
html,body{margin:0;background:#16181B}*{box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);font-family:"Noto Sans SC",sans-serif;padding:72px 100px;-webkit-font-smoothing:antialiased;text-wrap:pretty}
h1{font:900 54px/1.25 "Noto Sans SC";margin:0;letter-spacing:.01em}
.sub{font-size:25px;color:var(--mu);margin-top:14px;line-height:1.5;max-width:1600px}
.bl{color:var(--bl)}.yl{color:var(--yl)}.gr{color:var(--gr)}.rd{color:var(--rd)}.pu{color:var(--pu)}.mu{color:var(--mu)}
.mono,.chip{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
.card{background:var(--card);border-radius:18px;padding:26px 30px}
.vec{display:inline-flex;gap:4px;vertical-align:middle}.vec i{width:18px;height:18px;display:block;border-radius:4px}
.vcol{display:inline-flex;flex-direction:column;gap:4px;vertical-align:middle}.vcol i{width:34px;height:12px;display:block;border-radius:3px}
.ar{color:#5F666E;font-size:40px;display:flex;align-items:center;justify-content:center}
.foot{position:absolute;left:100px;bottom:40px;font-size:18px;color:#6E757C}
.cat{display:block;object-fit:cover;border-radius:12px}
.chip{display:inline-block;font:500 22px Menlo,"SF Mono",monospace;padding:6px 12px;border-radius:8px;margin:4px}
table{border-collapse:collapse;width:100%}
td,th{padding:14px 18px;text-align:left;font-size:23px;border-bottom:1px solid #2E3238}
th{color:var(--mu);font-weight:500;font-size:20px}
.tag{display:inline-block;font-size:18px;padding:3px 10px;border-radius:6px;background:var(--card2);color:var(--mu)}
body{padding-top:96px}.nav{position:absolute;left:100px;right:100px;top:22px;display:flex;gap:10px}
.nv{border-top:4px solid #2E3238;padding-top:6px}.nv.past{border-color:#58C4DD66}.nv.cur{border-color:var(--c)}
.nl{font-size:16px;color:#6E757C;white-space:nowrap}.nv.past .nl{color:#8A9199}.nv.cur .nl{color:var(--c);font-weight:700}
.take{position:absolute;left:100px;right:100px;bottom:70px;font:900 30px "Noto Sans SC";border-top:2px solid #2E3238;padding-top:18px}.take i{font-style:normal;color:var(--yl)}
.foot{bottom:28px}.n{font-size:22px;line-height:1.7}.n b{display:block;font-size:26px;margin-bottom:8px}
.stp{font:700 22px "Noto Sans SC";color:var(--mu);margin-bottom:10px}.stp b{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--card2);color:var(--fg);align-items:center;justify-content:center;margin-right:8px;font-size:20px}.fig{position:absolute;left:0;top:0;font-family:"Noto Sans SC",sans-serif}.fig .m{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none}</style></head><body><div class="nav"><div class="nv past" style="flex:4.5;--c:var(--fg)"><div class="nl">输入输出</div></div><div class="nv cur" style="flex:5.5;--c:var(--yl)"><div class="nl">训练目标 · 1/3</div></div><div class="nv" style="flex:4.5;--c:var(--pu)"><div class="nl">经典两段</div></div><div class="nv" style="flex:9.5;--c:var(--bl)"><div class="nl">预训练</div></div><div class="nv" style="flex:7.5;--c:var(--gr)"><div class="nl">后训练</div></div><div class="nv" style="flex:6.5;--c:var(--rd)"><div class="nl">强化学习</div></div><div class="nv" style="flex:4.5;--c:var(--fg)"><div class="nl">总结</div></div></div><h1>训练在优化什么：<span class="yl">让正确的下一个字概率变高</span></h1><div class="sub">不管预训练还是 SFT，看图模型的目标都只有一个：给定前面的图和字，猜下一个字。猜得越准，loss 越低。所谓「训练某一块」，就是让 loss 的梯度去更新这一块的参数。</div><svg class="fig" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="abl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#58C4DD"/></marker><marker id="ayl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FFE066"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5CD0B3"/></marker><marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FC6255"/></marker><marker id="apu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B189F5"/></marker><marker id="amu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9AA0A6"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ECECEC"/></marker><marker id="adk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5F666E"/></marker><marker id="aln" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2E3238"/></marker><marker id="acard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#202328"/></marker><marker id="acard2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#272B31"/></marker><marker id="abg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#16181B"/></marker><marker id="asv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C9CDD2"/></marker></defs><g transform="translate(0,0)"><rect x="100" y="350" width="170" height="56" rx="8" fill="#5CD0B355" opacity="1"/><text x="185.0" y="386.64" fill="#5CD0B3" font-size="24" font-weight="500" text-anchor="middle" opacity="1"><tspan x="185.0" dy="0">&lt;图 × 2040&gt;</tspan></text><rect x="278" y="350" width="50" height="56" rx="8" fill="#2E3238" opacity="1"/><text x="303.0" y="386.64" fill="#ECECEC" font-size="24" font-weight="500" text-anchor="middle" opacity="1"><tspan x="303.0" dy="0">图</tspan></text><rect x="336" y="350" width="50" height="56" rx="8" fill="#2E3238" opacity="1"/><text x="361.0" y="386.64" fill="#ECECEC" font-size="24" font-weight="500" text-anchor="middle" opacity="1"><tspan x="361.0" dy="0">里</tspan></text><rect x="394" y="350" width="50" height="56" rx="8" fill="#2E3238" opacity="1"/><text x="419.0" y="386.64" fill="#ECECEC" font-size="24" font-weight="500" text-anchor="middle" opacity="1"><tspan x="419.0" dy="0">是</tspan></text><rect x="452" y="350" width="50" height="56" rx="8" fill="#2E3238" opacity="1"/><text x="477.0" y="386.64" fill="#ECECEC" font-size="24" font-weight="500" text-anchor="middle" opacity="1"><tspan x="477.0" dy="0">一</tspan></text><rect x="510" y="350" width="50" height="56" rx="8" fill="#2E3238" opacity="1"/><text x="535.0" y="386.64" fill="#ECECEC" font-size="24" font-weight="500" text-anchor="middle" opacity="1"><tspan x="535.0" dy="0">只</tspan></text><rect x="568" y="350" width="56" height="56" rx="8" fill="none" opacity="1" stroke="#FFE066" stroke-width="3" stroke-dasharray="6 5"/><text x="596" y="389" fill="#FFE066" font-size="30" font-weight="900" text-anchor="middle" opacity="1"><tspan x="596" dy="0">?</tspan></text><text x="140" y="474" fill="#9AA0A6" font-size="20" font-weight="400" text-anchor="start" opacity="1"><tspan x="140" dy="0">模型在「?」处给词表里每个字打一个概率（示意数字）</tspan></text><text x="140" y="534" fill="#FFE066" font-size="28" font-weight="900" text-anchor="start" opacity="1"><tspan x="140" dy="0">猫</tspan></text><rect x="200" y="508" width="434.0" height="38" rx="6" fill="#FFE066" opacity="0.9"/><text x="644.0" y="536" fill="#FFE066" font-size="22" font-weight="700" text-anchor="start" opacity="1" class="m"><tspan x="644.0" dy="0">0.62</tspan></text><text x="140" y="592" fill="#9AA0A6" font-size="28" font-weight="900" text-anchor="start" opacity="1"><tspan x="140" dy="0">狗</tspan></text><rect x="200" y="566" width="126.0" height="38" rx="6" fill="#9AA0A6" opacity="0.5"/><text x="336.0" y="594" fill="#9AA0A6" font-size="22" font-weight="700" text-anchor="start" opacity="1" class="m"><tspan x="336.0" dy="0">0.18</tspan></text><text x="140" y="650" fill="#9AA0A6" font-size="28" font-weight="900" text-anchor="start" opacity="1"><tspan x="140" dy="0">橘</tspan></text><rect x="200" y="624" width="49.00000000000001" height="38" rx="6" fill="#9AA0A6" opacity="0.5"/><text x="259.0" y="652" fill="#9AA0A6" font-size="22" font-weight="700" text-anchor="start" opacity="1" class="m"><tspan x="259.0" dy="0">0.07</tspan></text><text x="140" y="708" fill="#9AA0A6" font-size="28" font-weight="900" text-anchor="start" opacity="1"><tspan x="140" dy="0">老</tspan></text><rect x="200" y="682" width="28.0" height="38" rx="6" fill="#9AA0A6" opacity="0.5"/><text x="238.0" y="710" fill="#9AA0A6" font-size="22" font-weight="700" text-anchor="start" opacity="1" class="m"><tspan x="238.0" dy="0">0.04</tspan></text><text x="140" y="766" fill="#9AA0A6" font-size="28" font-weight="900" text-anchor="start" opacity="1"><tspan x="140" dy="0">…</tspan></text><rect x="200" y="740" width="63.0" height="38" rx="6" fill="#5F666E" opacity="0.5"/><text x="273.0" y="768" fill="#9AA0A6" font-size="22" font-weight="700" text-anchor="start" opacity="1" class="m"><tspan x="273.0" dy="0">0.09</tspan></text><text x="1100" y="500" fill="#ECECEC" font-size="24" font-weight="700" text-anchor="start" opacity="1"><tspan x="1100" dy="0">正确答案是「猫」，loss 只看它的概率：</tspan></text><rect x="1100" y="530" width="720" height="120" rx="12" fill="#272B31" opacity="1"/><text x="1130" y="580" fill="#FFE066" font-size="28" font-weight="700" text-anchor="start" opacity="1" class="m"><tspan x="1130" dy="0">loss = −ln p(正确的字)</tspan></text><text x="1130" y="625" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1" class="m"><tspan x="1130" dy="0">p = 0.62 → loss 0.48　　p = 0.05 → loss 3.00</tspan></text><text x="1100" y="710" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="1100" dy="0">一段文字有 N 个位置，就同时练 N 次「猜下一个」，取平均：</tspan></text><rect x="1100" y="735" width="720" height="70" rx="12" fill="#272B31" opacity="1"/><text x="1130" y="780" fill="#ECECEC" font-size="22" font-weight="500" text-anchor="start" opacity="1" class="m"><tspan x="1130" dy="0">L = −(1/N) · Σ_t ln p(x_t | x_1 … x_(t−1))</tspan></text><text x="1100" y="850" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="1100" dy="0">反向传播算出 L 对每个参数的梯度，参数 −= 学习率 × 梯度。</tspan><tspan x="1100" dy="33"><tspan fill="#9AA0A6" font-weight="900">冻结</tspan> = 这一块不算梯度、不更新（requires_grad = False）。</tspan></text></g></svg><div class="take">整个训练只有一个目标：<i>下一个字</i>猜得更准</div><div class="foot">交叉熵 / 下一个 token 预测是自回归语言模型的通用目标；概率数字为示意</div></body></html>
