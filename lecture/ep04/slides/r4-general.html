<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>r4-general</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#16181B;--card:#202328;--card2:#272B31;--fg:#ECECEC;--mu:#9AA0A6;--bl:#58C4DD;--yl:#FFE066;--gr:#5CD0B3;--rd:#FC6255;--pu:#B189F5}
html,body{margin:0;background:#16181B}*{box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);font-family:"Noto Sans SC",sans-serif;padding:72px 100px;-webkit-font-smoothing:antialiased;text-wrap:pretty}
h1{font:900 54px/1.25 "Noto Sans SC";margin:0;letter-spacing:.01em}
.sub{font-size:25px;color:var(--mu);margin-top:14px;line-height:1.5;max-width:1600px}
.bl{color:var(--bl)}.yl{color:var(--yl)}.gr{color:var(--gr)}.rd{color:var(--rd)}.pu{color:var(--pu)}.mu{color:var(--mu)}
.mono,.chip{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
.card{background:var(--card);border-radius:18px;padding:26px 30px}
.vec{display:inline-flex;gap:4px;vertical-align:middle}.vec i{width:18px;height:18px;display:block;border-radius:4px}
.vcol{display:inline-flex;flex-direction:column;gap:4px;vertical-align:middle}.vcol i{width:34px;height:12px;display:block;border-radius:3px}
.ar{color:#5F666E;font-size:40px;display:flex;align-items:center;justify-content:center}
.foot{position:absolute;left:100px;bottom:40px;font-size:18px;color:#6E757C}
.cat{display:block;object-fit:cover;border-radius:12px}
.chip{display:inline-block;font:500 22px Menlo,"SF Mono",monospace;padding:6px 12px;border-radius:8px;margin:4px}
table{border-collapse:collapse;width:100%}
td,th{padding:14px 18px;text-align:left;font-size:23px;border-bottom:1px solid #2E3238}
th{color:var(--mu);font-weight:500;font-size:20px}
.tag{display:inline-block;font-size:18px;padding:3px 10px;border-radius:6px;background:var(--card2);color:var(--mu)}
body{padding-top:96px}.nav{position:absolute;left:100px;right:100px;top:22px;display:flex;gap:10px}
.nv{border-top:4px solid #2E3238;padding-top:6px}.nv.past{border-color:#58C4DD66}.nv.cur{border-color:var(--c)}
.nl{font-size:16px;color:#6E757C;white-space:nowrap}.nv.past .nl{color:#8A9199}.nv.cur .nl{color:var(--c);font-weight:700}
.take{position:absolute;left:100px;right:100px;bottom:70px;font:900 30px "Noto Sans SC";border-top:2px solid #2E3238;padding-top:18px}.take i{font-style:normal;color:var(--yl)}
.foot{bottom:28px}.n{font-size:22px;line-height:1.7}.n b{display:block;font-size:26px;margin-bottom:8px}
.stp{font:700 22px "Noto Sans SC";color:var(--mu);margin-bottom:10px}.stp b{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--card2);color:var(--fg);align-items:center;justify-content:center;margin-right:8px;font-size:20px}.fig{position:absolute;left:0;top:0;font-family:"Noto Sans SC",sans-serif}.fig .m{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none}</style></head><body><div class="nav"><div class="nv past" style="flex:4.5;--c:var(--fg)"><div class="nl">输入输出</div></div><div class="nv past" style="flex:5.5;--c:var(--yl)"><div class="nl">训练目标</div></div><div class="nv past" style="flex:4.5;--c:var(--pu)"><div class="nl">经典两段</div></div><div class="nv past" style="flex:9.5;--c:var(--bl)"><div class="nl">预训练</div></div><div class="nv past" style="flex:7.5;--c:var(--gr)"><div class="nl">后训练</div></div><div class="nv cur" style="flex:6.5;--c:var(--rd)"><div class="nl">强化学习 · 4/4</div></div><div class="nv" style="flex:4.5;--c:var(--fg)"><div class="nl">总结</div></div></div><h1>通用强化学习：<span class="rd">听指令、合口味、改掉坏习惯</span></h1><div class="sub">推理 RL 之后，再用一轮多任务强化学习，覆盖 SFT 里的问答、描述、OCR、文档解析、定位、看钟表等任务。规则能判的用规则，判不了的请大模型当裁判。</div><svg class="fig" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="abl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#58C4DD"/></marker><marker id="ayl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FFE066"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5CD0B3"/></marker><marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FC6255"/></marker><marker id="apu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B189F5"/></marker><marker id="amu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9AA0A6"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ECECEC"/></marker><marker id="adk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5F666E"/></marker><marker id="aln" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2E3238"/></marker><marker id="acard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#202328"/></marker><marker id="acard2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#272B31"/></marker><marker id="abg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#16181B"/></marker><marker id="asv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C9CDD2"/></marker></defs><g transform="translate(0,0)"><rect x="100" y="320" width="840" height="560" rx="16" fill="#202328" opacity="1" stroke="#5CD0B3" stroke-width="2"/><text x="130" y="372" fill="#5CD0B3" font-size="28" font-weight="900" text-anchor="start" opacity="1"><tspan x="130" dy="0">要它做到什么</tspan></text><circle cx="140" cy="422" r="6" fill="#5CD0B3"/><text x="160" y="430" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="160" dy="0">指令遵循：内容、格式、长度、JSON 等约束</tspan></text><circle cx="140" cy="506" r="6" fill="#5CD0B3"/><text x="160" y="514" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="160" dy="0">偏好对齐：开放问题上有用、准确、语气得体</tspan></text><circle cx="140" cy="590" r="6" fill="#5CD0B3"/><text x="160" y="598" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="160" dy="0">纠正凭印象答题的错（SFT 留下的错误先验）：</tspan><tspan x="160" dy="33">如六根手指答「五根」、表盘总读成 10:10（示意）</tspan></text><circle cx="140" cy="708" r="6" fill="#5CD0B3"/><text x="160" y="716" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="160" dy="0">另一类是输出坏毛病：中英混杂、重复、格式错</tspan><tspan x="160" dy="33">（专门收集会诱发它们的题，高频惩罚）</tspan></text><rect x="980" y="320" width="840" height="560" rx="16" fill="#202328" opacity="1" stroke="#FFE066" stroke-width="2"/><text x="1010" y="372" fill="#FFE066" font-size="28" font-weight="900" text-anchor="start" opacity="1"><tspan x="1010" dy="0">奖励怎么给</tspan></text><circle cx="1020" cy="422" r="6" fill="#FFE066"/><text x="1040" y="430" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="1040" dy="0">规则奖励：有标准答案的（格式、指令），</tspan><tspan x="1040" dy="33">精确、不容易被钻空子</tspan></text><circle cx="1020" cy="540" r="6" fill="#FFE066"/><text x="1040" y="548" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="1040" dy="0">模型奖励：Qwen2.5-VL-72B-Instruct 或 Qwen3</tspan><tspan x="1040" dy="33">当裁判，对照参考答案多维打分</tspan></text><circle cx="1020" cy="658" r="6" fill="#FFE066"/><text x="1040" y="666" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="1040" dy="0">模型裁判更宽容：答对了但写法不同，</tspan><tspan x="1040" dy="33">不会被误判</tspan></text></g></svg><div class="take">SFT 教会的<i>错误直觉</i>，在这里用可验证的题纠正</div><div class="foot">来源：Qwen3-VL 技术报告 arXiv 2511.21631 §4.4.2（p12）；六根手指、10:10 是社区常见例子，非报告原文；另有「看图思考」的工具调用 RL（§4.5），本讲义不展开</div></body></html>
