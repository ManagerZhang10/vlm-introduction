<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>c1-llava</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#16181B;--card:#202328;--card2:#272B31;--fg:#ECECEC;--mu:#9AA0A6;--bl:#58C4DD;--yl:#FFE066;--gr:#5CD0B3;--rd:#FC6255;--pu:#B189F5}
html,body{margin:0;background:#16181B}*{box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);font-family:"Noto Sans SC",sans-serif;padding:72px 100px;-webkit-font-smoothing:antialiased;text-wrap:pretty}
h1{font:900 54px/1.25 "Noto Sans SC";margin:0;letter-spacing:.01em}
.sub{font-size:25px;color:var(--mu);margin-top:14px;line-height:1.5;max-width:1600px}
.bl{color:var(--bl)}.yl{color:var(--yl)}.gr{color:var(--gr)}.rd{color:var(--rd)}.pu{color:var(--pu)}.mu{color:var(--mu)}
.mono,.chip{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
.card{background:var(--card);border-radius:18px;padding:26px 30px}
.vec{display:inline-flex;gap:4px;vertical-align:middle}.vec i{width:18px;height:18px;display:block;border-radius:4px}
.vcol{display:inline-flex;flex-direction:column;gap:4px;vertical-align:middle}.vcol i{width:34px;height:12px;display:block;border-radius:3px}
.ar{color:#5F666E;font-size:40px;display:flex;align-items:center;justify-content:center}
.foot{position:absolute;left:100px;bottom:40px;font-size:18px;color:#6E757C}
.cat{display:block;object-fit:cover;border-radius:12px}
.chip{display:inline-block;font:500 22px Menlo,"SF Mono",monospace;padding:6px 12px;border-radius:8px;margin:4px}
table{border-collapse:collapse;width:100%}
td,th{padding:14px 18px;text-align:left;font-size:23px;border-bottom:1px solid #2E3238}
th{color:var(--mu);font-weight:500;font-size:20px}
.tag{display:inline-block;font-size:18px;padding:3px 10px;border-radius:6px;background:var(--card2);color:var(--mu)}
body{padding-top:96px}.nav{position:absolute;left:100px;right:100px;top:22px;display:flex;gap:10px}
.nv{border-top:4px solid #2E3238;padding-top:6px}.nv.past{border-color:#58C4DD66}.nv.cur{border-color:var(--c)}
.nl{font-size:16px;color:#6E757C;white-space:nowrap}.nv.past .nl{color:#8A9199}.nv.cur .nl{color:var(--c);font-weight:700}
.take{position:absolute;left:100px;right:100px;bottom:70px;font:900 30px "Noto Sans SC";border-top:2px solid #2E3238;padding-top:18px}.take i{font-style:normal;color:var(--yl)}
.foot{bottom:28px}.n{font-size:22px;line-height:1.7}.n b{display:block;font-size:26px;margin-bottom:8px}
.stp{font:700 22px "Noto Sans SC";color:var(--mu);margin-bottom:10px}.stp b{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--card2);color:var(--fg);align-items:center;justify-content:center;margin-right:8px;font-size:20px}.fig{position:absolute;left:0;top:0;font-family:"Noto Sans SC",sans-serif}.fig .m{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none}</style></head><body><div class="nav"><div class="nv past" style="flex:4.5;--c:var(--fg)"><div class="nl">输入输出</div></div><div class="nv past" style="flex:5.5;--c:var(--yl)"><div class="nl">训练目标</div></div><div class="nv cur" style="flex:4.5;--c:var(--pu)"><div class="nl">经典两段 · 1/2</div></div><div class="nv" style="flex:9.5;--c:var(--bl)"><div class="nl">预训练</div></div><div class="nv" style="flex:7.5;--c:var(--gr)"><div class="nl">后训练</div></div><div class="nv" style="flex:6.5;--c:var(--rd)"><div class="nl">强化学习</div></div><div class="nv" style="flex:4.5;--c:var(--fg)"><div class="nl">总结</div></div></div><h1>经典做法：<span class="pu">LLaVA-1.5</span> 两段式——先对接口，再学对话</h1><div class="sub">新接上的投影层是随机的，大模型和视觉编码器却都是训好的。经典做法分两段：先冻住两头、只训中间，再放开大模型学按指令回答。视觉编码器一直冻着。</div><svg class="fig" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="abl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#58C4DD"/></marker><marker id="ayl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FFE066"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5CD0B3"/></marker><marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FC6255"/></marker><marker id="apu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B189F5"/></marker><marker id="amu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9AA0A6"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ECECEC"/></marker><marker id="adk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5F666E"/></marker><marker id="aln" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2E3238"/></marker><marker id="acard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#202328"/></marker><marker id="acard2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#272B31"/></marker><marker id="abg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#16181B"/></marker><marker id="asv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C9CDD2"/></marker></defs><g transform="translate(0,0)"><text x="100" y="340" fill="#B189F5" font-size="28" font-weight="900" text-anchor="start" opacity="1"><tspan x="100" dy="0">阶段 1：特征对齐</tspan></text><text x="370" y="340" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="370" dy="0">558K 条图文描述，只训投影层</tspan></text><text x="100" y="505" fill="#9AA0A6" font-size="20" font-weight="400" text-anchor="start" opacity="1" class="m"><tspan x="100" dy="0">lr 1e-3 · batch 256 · 1 轮</tspan></text><rect x="100" y="370" width="306.0" height="110" rx="14" fill="#272B31" opacity="1" stroke="#5F666E" stroke-width="3"/><text x="253.0" y="423.0" fill="#9AA0A6" font-size="24" font-weight="900" text-anchor="middle" opacity="1"><tspan x="253.0" dy="0">ViT（CLIP）</tspan></text><text x="253.0" y="459.0" fill="#5F666E" font-size="20" font-weight="700" text-anchor="middle" opacity="1"><tspan x="253.0" dy="0">冻结</tspan></text><line x1="412.0" y1="425.0" x2="454.0" y2="425.0" stroke="#C9CDD2" stroke-width="3" opacity="1" marker-end="url(#asv)"/><rect x="460.0" y="370" width="180.0" height="110" rx="14" fill="#FFE06626" opacity="1" stroke="#FFE066" stroke-width="3"/><text x="550.0" y="423.0" fill="#FFE066" font-size="24" font-weight="900" text-anchor="middle" opacity="1"><tspan x="550.0" dy="0">投影层</tspan></text><text x="550.0" y="459.0" fill="#FFE066" font-size="20" font-weight="700" text-anchor="middle" opacity="1"><tspan x="550.0" dy="0">在训</tspan></text><line x1="646.0" y1="425.0" x2="688.0" y2="425.0" stroke="#C9CDD2" stroke-width="3" opacity="1" marker-end="url(#asv)"/><rect x="694.0" y="370" width="306.0" height="110" rx="14" fill="#272B31" opacity="1" stroke="#5F666E" stroke-width="3"/><text x="847.0" y="423.0" fill="#9AA0A6" font-size="24" font-weight="900" text-anchor="middle" opacity="1"><tspan x="847.0" dy="0">LLM（Vicuna）</tspan></text><text x="847.0" y="459.0" fill="#5F666E" font-size="20" font-weight="700" text-anchor="middle" opacity="1"><tspan x="847.0" dy="0">冻结</tspan></text><text x="100" y="580" fill="#B189F5" font-size="28" font-weight="900" text-anchor="start" opacity="1"><tspan x="100" dy="0">阶段 2：指令微调</tspan></text><text x="370" y="580" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="370" dy="0">665K 条对话（10 个数据集混合），投影层 + LLM</tspan></text><text x="100" y="745" fill="#9AA0A6" font-size="20" font-weight="400" text-anchor="start" opacity="1" class="m"><tspan x="100" dy="0">lr 2e-5 · batch 128 · 1 轮</tspan></text><rect x="100" y="610" width="306.0" height="110" rx="14" fill="#272B31" opacity="1" stroke="#5F666E" stroke-width="3"/><text x="253.0" y="663.0" fill="#9AA0A6" font-size="24" font-weight="900" text-anchor="middle" opacity="1"><tspan x="253.0" dy="0">ViT（CLIP）</tspan></text><text x="253.0" y="699.0" fill="#5F666E" font-size="20" font-weight="700" text-anchor="middle" opacity="1"><tspan x="253.0" dy="0">冻结</tspan></text><line x1="412.0" y1="665.0" x2="454.0" y2="665.0" stroke="#C9CDD2" stroke-width="3" opacity="1" marker-end="url(#asv)"/><rect x="460.0" y="610" width="180.0" height="110" rx="14" fill="#FFE06626" opacity="1" stroke="#FFE066" stroke-width="3"/><text x="550.0" y="663.0" fill="#FFE066" font-size="24" font-weight="900" text-anchor="middle" opacity="1"><tspan x="550.0" dy="0">投影层</tspan></text><text x="550.0" y="699.0" fill="#FFE066" font-size="20" font-weight="700" text-anchor="middle" opacity="1"><tspan x="550.0" dy="0">在训</tspan></text><line x1="646.0" y1="665.0" x2="688.0" y2="665.0" stroke="#C9CDD2" stroke-width="3" opacity="1" marker-end="url(#asv)"/><rect x="694.0" y="610" width="306.0" height="110" rx="14" fill="#FFE06626" opacity="1" stroke="#FFE066" stroke-width="3"/><text x="847.0" y="663.0" fill="#FFE066" font-size="24" font-weight="900" text-anchor="middle" opacity="1"><tspan x="847.0" dy="0">LLM（Vicuna）</tspan></text><text x="847.0" y="699.0" fill="#FFE066" font-size="20" font-weight="700" text-anchor="middle" opacity="1"><tspan x="847.0" dy="0">在训</tspan></text><circle cx="1177" cy="341" r="17" fill="#FFE066"/><text x="1177" y="348" fill="#16181B" font-size="20" font-weight="900" text-anchor="middle" opacity="1"><tspan x="1177" dy="0">1</tspan></text><text x="1206" y="350" fill="#FFE066" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="1206" dy="0">为什么先只训投影层</tspan></text><text x="1160" y="390" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="1160" dy="0">投影层是随机的，输出等于噪声。</tspan><tspan x="1160" dy="33">这时就放开 LLM，它会被噪声带偏；</tspan><tspan x="1160" dy="33">先把接口对上，代价最小。</tspan></text><circle cx="1177" cy="551" r="17" fill="#FFE066"/><text x="1177" y="558" fill="#16181B" font-size="20" font-weight="900" text-anchor="middle" opacity="1"><tspan x="1177" dy="0">2</tspan></text><text x="1206" y="560" fill="#FFE066" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="1206" dy="0">为什么第二段才动 LLM</tspan></text><text x="1160" y="600" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="1160" dy="0">要学的是「按指令回答」，</tspan><tspan x="1160" dy="33">这需要改 LLM 自己的说话方式。</tspan></text><circle cx="1177" cy="741" r="17" fill="#FC6255"/><text x="1177" y="748" fill="#16181B" font-size="20" font-weight="900" text-anchor="middle" opacity="1"><tspan x="1177" dy="0">3</tspan></text><text x="1206" y="750" fill="#FC6255" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="1206" dy="0">留下的问题</tspan></text><text x="1160" y="790" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="1160" dy="0">ViT 从头到尾冻结：CLIP 只学过「图文配不配」，</tspan><tspan x="1160" dy="33">读小字、定位、数数这些能力补不上。</tspan></text></g></svg><div class="take"><i>先接口、后能力</i>：后来的模型都沿着这个思路，只是分得更细</div><div class="foot">来源：LLaVA-1.5 arXiv 2310.03744（表 3、表 7、附录超参）；1.5 没逐段写哪些参数可训，按原版 LLaVA arXiv 2304.08485 p5 沿用。8×A100 约 1 天</div></body></html>
