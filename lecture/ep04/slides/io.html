ont-weight="700" text-anchor="start" opacity="1"><tspan x="1350" dy="0">终点（训练后）</tspan></text><svg x="1350" y="350" width="150" height="134" viewBox="0 0 360 320" preserveAspectRatio="xMidYMid slice"><image href="../assets/cat.png" width="360" height="320"/></svg><text x="1520" y="410" fill="#ECECEC" font-size="24" font-weight="700" text-anchor="start" opacity="1"><tspan x="1520" dy="0">问：图里有几只猫？</tspan></text><rect x="1350" y="510" width="470" height="150" rx="16" fill="#202328" opacity="1" stroke="#5CD0B3" stroke-width="3"/><text x="1376" y="556" fill="#5CD0B3" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="1376" dy="0">Instruct 版</tspan></text><text x="1376" y="598" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="1376" dy="0">直接回答：</tspan><tspan x="1376" dy="33">「一只。」</tspan></text><rect x="1350" y="680" width="470" height="160" rx="16" fill="#202328" opacity="1" stroke="#B189F5" stroke-width="3"/><text x="1376" y="726" fill="#B189F5" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="1376" dy="0">Thinking 版</tspan></text><text x="1376" y="768" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="1376" dy="0">先写思考过程再答：</tspan><tspan x="1376" dy="33">「&lt;think&gt;画面里只有一个猫头……</tspan><tspan x="1376" dy="33">&lt;/think&gt; 一只。」</tspan></text></g></svg><div class="take"><i>训练</i>就是决定：每一段调哪些零件、喂什么数据、序列多长</div><div class="foot">来源：Qwen3-VL 技术报告 arXiv 2511.21631 §2、§3.1、§4.1；参数量按 HF config 逐项计算（research/qwen3vl_arch_facts.md C 节）</div></body></html>
