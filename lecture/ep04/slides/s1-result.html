<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>s1-result</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#16181B;--card:#202328;--card2:#272B31;--fg:#ECECEC;--mu:#9AA0A6;--bl:#58C4DD;--yl:#FFE066;--gr:#5CD0B3;--rd:#FC6255;--pu:#B189F5}
html,body{margin:0;background:#16181B}*{box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);font-family:"Noto Sans SC",sans-serif;padding:72px 100px;-webkit-font-smoothing:antialiased;text-wrap:pretty}
h1{font:900 54px/1.25 "Noto Sans SC";margin:0;letter-spacing:.01em}
.sub{font-size:25px;color:var(--mu);margin-top:14px;line-height:1.5;max-width:1600px}
.bl{color:var(--bl)}.yl{color:var(--yl)}.gr{color:var(--gr)}.rd{color:var(--rd)}.pu{color:var(--pu)}.mu{color:var(--mu)}
.mono,.chip{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
.card{background:var(--card);border-radius:18px;padding:26px 30px}
.vec{display:inline-flex;gap:4px;vertical-align:middle}.vec i{width:18px;height:18px;display:block;border-radius:4px}
.vcol{display:inline-flex;flex-direction:column;gap:4px;vertical-align:middle}.vcol i{width:34px;height:12px;display:block;border-radius:3px}

.foot{position:absolute;left:100px;bottom:40px;font-size:18px;color:#6E757C}
.cat{display:block;object-fit:cover;border-radius:12px}
.chip{display:inline-block;font:500 22px Menlo,"SF Mono",monospace;padding:6px 12px;border-radius:8px;margin:4px}
table{border-collapse:collapse;width:100%}
td,th{padding:14px 18px;text-align:left;font-size:23px;border-bottom:1px solid #2E3238}
th{color:var(--mu);font-weight:500;font-size:20px}
.tag{display:inline-block;font-size:18px;padding:3px 10px;border-radius:6px;background:var(--card2);color:var(--mu)}
body{padding-top:96px}.nav{position:absolute;left:100px;right:100px;top:22px;display:flex;gap:10px}
.nv{border-top:4px solid #2E3238;padding-top:6px}.nv.past{border-color:#58C4DD66}.nv.cur{border-color:var(--c)}
.nl{font-size:16px;color:#6E757C;white-space:nowrap}.nv.past .nl{color:#8A9199}.nv.cur .nl{color:var(--c);font-weight:700}

.foot{bottom:28px}.n{font-size:22px;line-height:1.7}.n b{display:block;font-size:26px;margin-bottom:8px}
.stp{font:700 22px "Noto Sans SC";color:var(--mu);margin-bottom:10px}.stp b{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--card2);color:var(--fg);align-items:center;justify-content:center;margin-right:8px;font-size:20px}.fig{position:absolute;left:0;top:0;font-family:"Noto Sans SC",sans-serif}.fig .m{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none}</style></head><body><div class="nav"><div class="nv past" style="flex:4.5;--c:var(--fg)"><div class="nl">输入输出</div></div><div class="nv past" style="flex:5.5;--c:var(--yl)"><div class="nl">训练目标</div></div><div class="nv past" style="flex:4.5;--c:var(--pu)"><div class="nl">经典两段</div></div><div class="nv past" style="flex:9.5;--c:var(--bl)"><div class="nl">预训练</div></div><div class="nv past" style="flex:6.5;--c:var(--gr)"><div class="nl">后训练</div></div><div class="nv past" style="flex:6.5;--c:var(--rd)"><div class="nl">强化学习</div></div><div class="nv cur" style="flex:4.5;--c:var(--fg)"><div class="nl">总结 · 1/2</div></div></div><h1>结果：<span class="yl">纯文本题</span>上也超过了同尺寸的纯文本模型</h1><div class="sub">担心了一整集的遗忘，最后的答卷：同是 8B，Qwen3-VL 在纯文本的数学和知识题上，比它的语言底座 Qwen3-8B 还高。</div><svg class="fig" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="abl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#58C4DD"/></marker><marker id="ayl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FFE066"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5CD0B3"/></marker><marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FC6255"/></marker><marker id="apu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight=
