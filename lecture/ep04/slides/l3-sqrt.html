<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>l3-sqrt</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#16181B;--card:#202328;--card2:#272B31;--fg:#ECECEC;--mu:#9AA0A6;--bl:#58C4DD;--yl:#FFE066;--gr:#5CD0B3;--rd:#FC6255;--pu:#B189F5}
html,body{margin:0;background:#16181B}*{box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);font-family:"Noto Sans SC",sans-serif;padding:72px 100px;-webkit-font-smoothing:antialiased;text-wrap:pretty}
h1{font:900 54px/1.25 "Noto Sans SC";margin:0;letter-spacing:.01em}
.sub{font-size:25px;color:var(--mu);margin-top:14px;line-height:1.5;max-width:1600px}
.bl{color:var(--bl)}.yl{color:var(--yl)}.gr{color:var(--gr)}.rd{color:var(--rd)}.pu{color:var(--pu)}.mu{color:var(--mu)}
.mono,.chip{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
.card{background:var(--card);border-radius:18px;padding:26px 30px}
.vec{display:inline-flex;gap:4px;vertical-align:middle}.vec i{width:18px;height:18px;display:block;border-radius:4px}
.vcol{display:inline-flex;flex-direction:column;gap:4px;vertical-align:middle}.vcol i{width:34px;height:12px;display:block;border-radius:3px}
.ar{color:#5F666E;font-size:40px;display:flex;align-items:center;justify-content:center}
.foot{position:absolute;left:100px;bottom:40px;font-size:18px;color:#6E757C}
.cat{display:block;object-fit:cover;border-radius:12px}
.chip{display:inline-block;font:500 22px Menlo,"SF Mono",monospace;padding:6px 12px;border-radius:8px;margin:4px}
table{border-collapse:collapse;width:100%}
td,th{padding:14px 18px;text-align:left;font-size:23px;border-bottom:1px solid #2E3238}
th{color:var(--mu);font-weight:500;font-size:20px}
.tag{display:inline-block;font-size:18px;padding:3px 10px;border-radius:6px;background:var(--card2);color:var(--mu)}
body{padding-top:96px}.nav{position:absolute;left:100px;right:100px;top:22px;display:flex;gap:10px}
.nv{border-top:4px solid #2E3238;padding-top:6px}.nv.past{border-color:#58C4DD66}.nv.cur{border-color:var(--c)}
.nl{font-size:16px;color:#6E757C;white-space:nowrap}.nv.past .nl{color:#8A9199}.nv.cur .nl{color:var(--c);font-weight:700}
.take{position:absolute;left:100px;right:100px;bottom:70px;font:900 30px "Noto Sans SC";border-top:2px solid #2E3238;padding-top:18px}.take i{font-style:normal;color:var(--yl)}
.foot{bottom:28px}.n{font-size:22px;line-height:1.7}.n b{display:block;font-size:26px;margin-bottom:8px}
.stp{font:700 22px "Noto Sans SC";color:var(--mu);margin-bottom:10px}.stp b{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--card2);color:var(--fg);align-items:center;justify-content:center;margin-right:8px;font-size:20px}.fig{position:absolute;left:0;top:0;font-family:"Noto Sans SC",sans-serif}.fig .m{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none}</style></head><body><div class="nav"><div class="nv past" style="flex:4.5;--c:var(--fg)"><div class="nl">输入输出</div></div><div class="nv cur" style="flex:5.5;--c:var(--yl)"><div class="nl">训练目标 · 3/3</div></div><div class="nv" style="flex:4.5;--c:var(--pu)"><div class="nl">经典两段</div></div><div class="nv" style="flex:9.5;--c:var(--bl)"><div class="nl">预训练</div></div><div class="nv" style="flex:7.5;--c:var(--gr)"><div class="nl">后训练</div></div><div class="nv" style="flex:6.5;--c:var(--rd)"><div class="nl">强化学习</div></div><div class="nv" style="flex:4.5;--c:var(--fg)"><div class="nl">总结</div></div></div><h1>长短样本混着训，每条该占多少分量？<span class="yl">平方根归一化</span>折中</h1><div class="sub">同一批里既有几十个字的图片问答，也有上万字的长文档。按样本平均，长文档里每个字几乎没分量；按 token 平均，长文档占满训练、图片问答被淹没。Qwen3-VL 从「按样本平均」改成「平方根归一化的按 token 平均」，报告说这样多模态更强、文字能力不掉。</div><svg class="fig" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="abl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#58C4DD"/></marker><marker id="ayl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FFE066"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5CD0B3"/></marker><marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FC6255"/></marker><marker id="apu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B189F5"/></marker><marker id="amu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9AA0A6"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ECECEC"/></marker><marker id="adk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5F666E"/></marker><marker id="aln" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2E3238"/></marker><marker id="acard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#202328"/></marker><marker id="acard2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#272B31"/></marker><marker id="abg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#16181B"/></marker><marker id="asv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C9CDD2"/></marker></defs><g transform="translate(0,0)"><rect x="100" y="320" width="560" height="110" rx="14" fill="#202328" opacity="1"/><text x="130" y="366" fill="#5CD0B3" font-size="24" font-weight="900" text-anchor="start" opacity="1"><tspan x="130" dy="0">样本 A：一道图片问答</tspan></text><text x="130" y="404" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="130" dy="0">回答 100 个 token</tspan></text><rect x="700" y="320" width="560" height="110" rx="14" fill="#202328" opacity="1"/><text x="730" y="366" fill="#58C4DD" font-size="24" font-weight="900" text-anchor="start" opacity="1"><tspan x="730" dy="0">样本 B：一篇长文档</tspan></text><text x="730" y="404" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="730" dy="0">10000 个 token</tspan></text><text x="100" y="516" fill="#ECECEC" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="100" dy="0">按样本平均</tspan></text><text x="100" y="554" fill="#C9CDD2" font-size="20" font-weight="500" text-anchor="start" opacity="1" class="m"><tspan x="100" dy="0">每个 token 权重 = 1/n</tspan></text><rect x="520" y="490" width="300" height="34" rx="4" fill="#5CD0B3" opacity="0.9"/><rect x="520" y="534" width="300" height="34" rx="4" fill="#58C4DD" opacity="0.9"/><text x="1150" y="520" fill="#ECECEC" font-size="30" font-weight="900" text-anchor="start" opacity="1" class="m"><tspan x="1150" dy="0">1 : 1</tspan></text><text x="1150" y="562" fill="#C9CDD2" font-size="21" font-weight="400" text-anchor="start" opacity="1"><tspan x="1150" dy="0">长文档里每个字几乎没分量</tspan></text><text x="100" y="656" fill="#ECECEC" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="100" dy="0">按 token 平均</tspan></text><text x="100" y="694" fill="#C9CDD2" font-size="20" font-weight="500" text-anchor="start" opacity="1" class="m"><tspan x="100" dy="0">每个 token 权重 = 1</tspan></text><rect x="520" y="630" width="6" height="34" rx="4" fill="#5CD0B3" opacity="0.9"/><rect x="520" y="674" width="600" height="34" rx="4" fill="#58C4DD" opacity="0.9"/><text x="1150" y="660" fill="#ECECEC" font-size="30" font-weight="900" text-anchor="start" opacity="1" class="m"><tspan x="1150" dy="0">1 : 100</tspan></text><text x="1150" y="702" fill="#C9CDD2" font-size="21" font-weight="400" text-anchor="start" opacity="1"><tspan x="1150" dy="0">长样本占满训练，短的图片问答被淹没</tspan></text><text x="100" y="796" fill="#FFE066" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="100" dy="0">平方根归一化</tspan></text><text x="100" y="834" fill="#C9CDD2" font-size="20" font-weight="500" text-anchor="start" opacity="1" class="m"><tspan x="100" dy="0">每个 token 权重 = 1/√n</tspan></text><rect x="520" y="770" width="60" height="34" rx="4" fill="#5CD0B3" opacity="0.9"/><rect x="520" y="814" width="600" height="34" rx="4" fill="#58C4DD" opacity="0.9"/><text x="1150" y="800" fill="#FFE066" font-size="30" font-weight="900" text-anchor="start" opacity="1" class="m"><tspan x="1150" dy="0">1 : 10</tspan></text><text x="1150" y="842" fill="#C9CDD2" font-size="21" font-weight="400" text-anchor="start" opacity="1"><tspan x="1150" dy="0">两头折中</tspan></text><text x="520" y="470" fill="#9AA0A6" font-size="20" font-weight="400" text-anchor="start" opacity="1"><tspan x="520" dy="0"><tspan fill="#5CD0B3" font-weight="700">绿</tspan> A 整条的分量　<tspan fill="#58C4DD" font-weight="700">蓝</tspan> B 整条的分量（每一行内按比例）</tspan></text></g></svg><div class="take">长度 100 倍，分量只给 <i>10 倍</i></div><div class="foot">来源：Qwen3-VL 技术报告 arXiv 2511.21631 p1–p2（只有一句话，没给公式）。「每个 token 权重 = 1/√n」是按字面意思的推断，非原文</div></body></html>
