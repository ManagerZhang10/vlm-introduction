<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>p2-s1</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#16181B;--card:#202328;--card2:#272B31;--fg:#ECECEC;--mu:#9AA0A6;--bl:#58C4DD;--yl:#FFE066;--gr:#5CD0B3;--rd:#FC6255;--pu:#B189F5}
html,body{margin:0;background:#16181B}*{box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);font-family:"Noto Sans SC",sans-serif;padding:72px 100px;-webkit-font-smoothing:antialiased;text-wrap:pretty}
h1{font:900 54px/1.25 "Noto Sans SC";margin:0;letter-spacing:.01em}
.sub{font-size:25px;color:var(--mu);margin-top:14px;line-height:1.5;max-width:1600px}
.bl{color:var(--bl)}.yl{color:var(--yl)}.gr{color:var(--gr)}.rd{color:var(--rd)}.pu{color:var(--pu)}.mu{color:var(--mu)}
.mono,.chip{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
.card{background:var(--card);border-radius:18px;padding:26px 30px}
.vec{display:inline-flex;gap:4px;vertical-align:middle}.vec i{width:18px;height:18px;display:block;border-radius:4px}
.vcol{display:inline-flex;flex-direction:column;gap:4px;vertical-align:middle}.vcol i{width:34px;height:12px;display:block;border-radius:3px}
.ar{color:#5F666E;font-size:40px;display:flex;align-items:center;justify-content:center}
.foot{position:absolute;left:100px;bottom:40px;font-size:18px;color:#6E757C}
.cat{display:block;object-fit:cover;border-radius:12px}
.chip{display:inline-block;font:500 22px Menlo,"SF Mono",monospace;padding:6px 12px;border-radius:8px;margin:4px}
table{border-collapse:collapse;width:100%}
td,th{padding:14px 18px;text-align:left;font-size:23px;border-bottom:1px solid #2E3238}
th{color:var(--mu);font-weight:500;font-size:20px}
.tag{display:inline-block;font-size:18px;padding:3px 10px;border-radius:6px;background:var(--card2);color:var(--mu)}
body{padding-top:96px}.nav{position:absolute;left:100px;right:100px;top:22px;display:flex;gap:10px}
.nv{border-top:4px solid #2E3238;padding-top:6px}.nv.past{border-color:#58C4DD66}.nv.cur{border-color:var(--c)}
.nl{font-size:16px;color:#6E757C;white-space:nowrap}.nv.past .nl{color:#8A9199}.nv.cur .nl{color:var(--c);font-weight:700}
.take{position:absolute;left:100px;right:100px;bottom:70px;font:900 30px "Noto Sans SC";border-top:2px solid #2E3238;padding-top:18px}.take i{font-style:normal;color:var(--yl)}
.foot{bottom:28px}.n{font-size:22px;line-height:1.7}.n b{display:block;font-size:26px;margin-bottom:8px}
.stp{font:700 22px "Noto Sans SC";color:var(--mu);margin-bottom:10px}.stp b{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--card2);color:var(--fg);align-items:center;justify-content:center;margin-right:8px;font-size:20px}.fig{position:absolute;left:0;top:0;font-family:"Noto Sans SC",sans-serif}.fig .m{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none}</style></head><body><div class="nav"><div class="nv past" style="flex:4.5;--c:var(--fg)"><div class="nl">输入输出</div></div><div class="nv past" style="flex:5.5;--c:var(--yl)"><div class="nl">训练目标</div></div><div class="nv past" style="flex:4.5;--c:var(--pu)"><div class="nl">经典两段</div></div><div class="nv cur" style="flex:9.5;--c:var(--bl)"><div class="nl">预训练 · 3/7</div></div><div class="nv" style="flex:6.5;--c:var(--gr)"><div class="nl">后训练</div></div><div class="nv" style="flex:6.5;--c:var(--rd)"><div class="nl">强化学习</div></div><div class="nv" style="flex:4.5;--c:var(--fg)"><div class="nl">总结</div></div></div><h1>S1 多模态预训练：<span class="yl">三块全部放开</span>，混着纯文本一起训</h1><div class="sub">接口对上之后，限制变成了能力：ViT 只学过图文配不配，大模型从没见过图。S1 把 ViT、合并器、大模型全部解冻，用约 1 万亿 token 的图文和纯文本端到端训练。</div><svg class="fig" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="abl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#58C4DD"/></marker><marker id="ayl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FFE066"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5CD0B3"/></marker><marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FC6255"/></marker><marker id="apu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B189F5"/></marker><marker id="amu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9AA0A6"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ECECEC"/></marker><marker id="adk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5F666E"/></marker><marker id="aln" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2E3238"/></marker><marker id="acard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#202328"/></marker><marker id="acard2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#272B31"/></marker><marker id="abg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#16181B"/></marker><marker id="asv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C9CDD2"/></marker></defs><g transform="translate(0,0)"><rect x="100" y="360" width="340.0" height="140" rx="14" fill="#FFE06626" opacity="1" stroke="#FFE066" stroke-width="3"/><text x="270.0" y="428.0" fill="#FFE066" font-size="30" font-weight="900" text-anchor="middle" opacity="1"><tspan x="270.0" dy="0">ViT</tspan></text><text x="270.0" y="464.0" fill="#FFE066" font-size="20" font-weight="700" text-anchor="middle" opacity="1"><tspan x="270.0" dy="0">在训</tspan></text><line x1="446.0" y1="430.0" x2="494.0" y2="430.0" stroke="#C9CDD2" stroke-width="3" opacity="1" marker-end="url(#asv)"/><rect x="500.0" y="360" width="200.0" height="140" rx="14" fill="#FFE06626" opacity="1" stroke="#FFE066" stroke-width="3"/><text x="600.0" y="428.0" fill="#FFE066" font-size="30" font-weight="900" text-anchor="middle" opacity="1"><tspan x="600.0" dy="0">合并器</tspan></text><text x="600.0" y="464.0" fill="#FFE066" font-size="20" font-weight="700" text-anchor="middle" opacity="1"><tspan x="600.0" dy="0">在训</tspan></text><line x1="706.0" y1="430.0" x2="754.0" y2="430.0" stroke="#C9CDD2" stroke-width="3" opacity="1" marker-end="url(#asv)"/><rect x="760.0" y="360" width="340.0" height="140" rx="14" fill="#FFE06626" opacity="1" stroke="#FFE066" stroke-width="3"/><text x="930.0" y="428.0" fill="#FFE066" font-size="30" font-weight="900" text-anchor="middle" opacity="1"><tspan x="930.0" dy="0">大模型</tspan></text><text x="930.0" y="464.0" fill="#FFE066" font-size="20" font-weight="700" text-anchor="middle" opacity="1"><tspan x="930.0" dy="0">在训</tspan></text><text x="100" y="560" fill="#ECECEC" font-size="24" font-weight="900" text-anchor="start" opacity="1"><tspan x="100" dy="0">和 LLaVA 的区别：</tspan></text><text x="320" y="560" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="320" dy="0"><tspan fill="#FFE066" font-weight="900">ViT 也放开训</tspan>。读小字、框位置、数数，靠冻住的 CLIP 学不会。</tspan></text><text x="100" y="640" fill="#ECECEC" font-size="24" font-weight="900" text-anchor="start" opacity="1"><tspan x="100" dy="0">约 1 万亿 token，序列长 8K（≈ 1.2 亿条满长序列）</tspan></text><rect x="100" y="670" width="144" height="54" rx="10" fill="#58C4DD22" opacity="1" stroke="#58C4DD" stroke-width="2"/><text x="172.0" y="705" fill="#58C4DD" font-size="22" font-weight="700" text-anchor="middle" opacity="1"><tspan x="172.0" dy="0">交错图文</tspan></text><rect x="258" y="670" width="222" height="54" rx="10" fill="#58C4DD22" opacity="1" stroke="#58C4DD" stroke-width="2"/><text x="369.0" y="705" fill="#58C4DD" font-size="22" font-weight="700" text-anchor="middle" opacity="1"><tspan x="369.0" dy="0">定位框 / 点</tspan></text><rect x="494" y="670" width="144" height="54" rx="10" fill="#58C4DD22" opacity="1" stroke="#58C4DD" stroke-width="2"/><text x="566.0" y="705" fill="#58C4DD" font-size="22" font-weight="700" text-anchor="middle" opacity="1"><tspan x="566.0" dy="0">视觉问答</tspan></text><rect x="652" y="670" width="248" height="54" rx="10" fill="#58C4DD22" opacity="1" stroke="#58C4DD" stroke-width="2"/><text x="776.0" y="705" fill="#58C4DD" font-size="22" font-weight="700" text-anchor="middle" opacity="1"><tspan x="776.0" dy="0">理科（STEM）</tspan></text><rect x="914" y="670" width="144" height="54" rx="10" fill="#58C4DD22" opacity="1" stroke="#58C4DD" stroke-width="2"/><text x="986.0" y="705" fill="#58C4DD" font-size="22" font-weight="700" text-anchor="middle" opacity="1"><tspan x="986.0" dy="0">少量视频</tspan></text><rect x="1072" y="670" width="118" height="54" rx="10" fill="#FFE06622" opacity="1" stroke="#FFE066" stroke-width="2"/><text x="1131.0" y="705" fill="#FFE066" font-size="22" font-weight="700" text-anchor="middle" opacity="1"><tspan x="1131.0" dy="0">纯文本</tspan></text><text x="100" y="780" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="100" dy="0">报告没写各类占多少比例。纯文本的作用写得很明确：「保持大模型的语言能力」。</tspan></text><circle cx="1217" cy="361" r="17" fill="#FFE066"/><text x="1217" y="368" fill="#16181B" font-size="20" font-weight="900" text-anchor="middle" opacity="1"><tspan x="1217" dy="0">1</tspan></text><text x="1246" y="370" fill="#FFE066" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="1246" dy="0">目的</tspan></text><text x="1200" y="410" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="1200" dy="0">从「接口通了」到「真的会看图」：</tspan><tspan x="1200" dy="33">认东西、读字、找位置、做题、</tspan><tspan x="1200" dy="33">第一次接触时间。</tspan></text><circle cx="1217" cy="611" r="17" fill="#FFE066"/><text x="1217" y="618" fill="#16181B" font-size="20" font-weight="900" text-anchor="middle" opacity="1"><tspan x="1217" dy="0">2</tspan></text><text x="1246" y="620" fill="#FFE066" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="1246" dy="0">为什么这时才放开</tspan></text><text x="1200" y="660" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="1200" dy="0">S0 之后图 token 已经有意义，</tspan><tspan x="1200" dy="33">全参训练的梯度不再是噪声；</tspan><tspan x="1200" dy="33">同时混纯文本，压住遗忘。</tspan></text></g></svg><div class="take"><i>能力</i>主要在这 1 万亿 token 里长出来</div><div class="foot">来源：Qwen3-VL 技术报告 arXiv 2511.21631 Table 1、§3.1 Stage 1（p4–5）；序列条数为算术</div></body></html>
