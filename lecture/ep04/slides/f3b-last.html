<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>f3b-last</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#16181B;--card:#202328;--card2:#272B31;--fg:#ECECEC;--mu:#9AA0A6;--bl:#58C4DD;--yl:#FFE066;--gr:#5CD0B3;--rd:#FC6255;--pu:#B189F5}
html,body{margin:0;background:#16181B}*{box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);font-family:"Noto Sans SC",sans-serif;padding:72px 100px;-webkit-font-smoothing:antialiased;text-wrap:pretty}
h1{font:900 54px/1.25 "Noto Sans SC";margin:0;letter-spacing:.01em}
.sub{font-size:25px;color:var(--mu);margin-top:14px;line-height:1.5;max-width:1600px}
.bl{color:var(--bl)}.yl{color:var(--yl)}.gr{color:var(--gr)}.rd{color:var(--rd)}.pu{color:var(--pu)}.mu{color:var(--mu)}
.mono,.chip{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
.card{background:var(--card);border-radius:18px;padding:26px 30px}
.vec{display:inline-flex;gap:4px;vertical-align:middle}.vec i{width:18px;height:18px;display:block;border-radius:4px}
.vcol{display:inline-flex;flex-direction:column;gap:4px;vertical-align:middle}.vcol i{width:34px;height:12px;display:block;border-radius:3px}
.ar{color:#5F666E;font-size:40px;display:flex;align-items:center;justify-content:center}
.foot{position:absolute;left:100px;bottom:40px;font-size:18px;color:#6E757C}
.cat{display:block;object-fit:cover;border-radius:12px}
.chip{display:inline-block;font:500 22px Menlo,"SF Mono",monospace;padding:6px 12px;border-radius:8px;margin:4px}
table{border-collapse:collapse;width:100%}
td,th{padding:14px 18px;text-align:left;font-size:23px;border-bottom:1px solid #2E3238}
th{color:var(--mu);font-weight:500;font-size:20px}
.tag{display:inline-block;font-size:18px;padding:3px 10px;border-radius:6px;background:var(--card2);color:var(--mu)}
body{padding-top:96px}.nav{position:absolute;left:100px;right:100px;top:22px;display:flex;gap:10px}
.nv{border-top:4px solid #2E3238;padding-top:6px}.nv.past{border-color:#58C4DD66}.nv.cur{border-color:var(--c)}
.nl{font-size:16px;color:#6E757C;white-space:nowrap}.nv.past .nl{color:#8A9199}.nv.cur .nl{color:var(--c);font-weight:700}
.take{position:absolute;left:100px;right:100px;bottom:70px;font:900 30px "Noto Sans SC";border-top:2px solid #2E3238;padding-top:18px}.take i{font-style:normal;color:var(--yl)}
.foot{bottom:28px}.n{font-size:22px;line-height:1.7}.n b{display:block;font-size:26px;margin-bottom:8px}
.stp{font:700 22px "Noto Sans SC";color:var(--mu);margin-bottom:10px}.stp b{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--card2);color:var(--fg);align-items:center;justify-content:center;margin-right:8px;font-size:20px}.fig{position:absolute;left:0;top:0;font-family:"Noto Sans SC",sans-serif}.fig .m{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none}</style></head><body><div class="nav"><div class="nv past" style="flex:4.5;--c:var(--fg)"><div class="nl">输入输出</div></div><div class="nv past" style="flex:5.5;--c:var(--yl)"><div class="nl">训练目标</div></div><div class="nv past" style="flex:4.5;--c:var(--pu)"><div class="nl">经典两段</div></div><div class="nv past" style="flex:9.5;--c:var(--bl)"><div class="nl">预训练</div></div><div class="nv cur" style="flex:7.5;--c:var(--gr)"><div class="nl">后训练 · 4/5</div></div><div class="nv" style="flex:6.5;--c:var(--rd)"><div class="nl">强化学习</div></div><div class="nv" style="flex:4.5;--c:var(--fg)"><div class="nl">总结</div></div></div><h1>大模型拼进来时已经很强，<span class="yl">为什么纯文本蒸馏放在最后</span>？</h1><div class="sub">直觉是：纯文本蒸馏应该在拼进 VLM 之前做完。但拼接之后大模型还要被海量图文继续训练，放在前面多半会被冲淡；而在线蒸馏纠正的，必须是训到最后的那个模型自己的错。</div><svg class="fig" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="abl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#58C4DD"/></marker><marker id="ayl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FFE066"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5CD0B3"/></marker><marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FC6255"/></marker><marker id="apu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B189F5"/></marker><marker id="amu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9AA0A6"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ECECEC"/></marker><marker id="adk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5F666E"/></marker><marker id="aln" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2E3238"/></marker><marker id="acard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#202328"/></marker><marker id="acard2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#272B31"/></marker><marker id="abg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#16181B"/></marker><marker id="asv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C9CDD2"/></marker></defs><g transform="translate(0,0)"><rect x="100" y="320" width="320" height="130" rx="12" fill="#9AA0A61F" opacity="1" stroke="#9AA0A6" stroke-width="2"/><text x="260" y="362" fill="#9AA0A6" font-size="26" font-weight="900" text-anchor="middle" opacity="1"><tspan x="260" dy="0">拼接</tspan></text><text x="260" y="398" fill="#C9CDD2" font-size="17" font-weight="400" text-anchor="middle" opacity="1"><tspan x="260" dy="0">语言部分：现成的 Qwen3</tspan><tspan x="260" dy="25">（报告没写是 base 还是对话版）</tspan></text><line x1="424" y1="385" x2="442" y2="385" stroke="#C9CDD2" stroke-width="2" opacity="1" marker-end="url(#asv)"/><rect x="445" y="320" width="320" height="130" rx="12" fill="#58C4DD1F" opacity="1" stroke="#58C4DD" stroke-width="2"/><text x="605" y="362" fill="#58C4DD" font-size="26" font-weight="900" text-anchor="middle" opacity="1"><tspan x="605" dy="0">S0～S3</tspan></text><text x="605" y="398" fill="#C9CDD2" font-size="17" font-weight="400" text-anchor="middle" opacity="1"><tspan x="605" dy="0">大模型全参续训</tspan><tspan x="605" dy="25">约 2.2 万亿 token</tspan></text><line x1="769" y1="385" x2="787" y2="385" stroke="#C9CDD2" stroke-width="2" opacity="1" marker-end="url(#asv)"/><rect x="790" y="320" width="320" height="130" rx="12" fill="#5CD0B31F" opacity="1" stroke="#5CD0B3" stroke-width="2"/><text x="950" y="362" fill="#5CD0B3" font-size="26" font-weight="900" text-anchor="middle" opacity="1"><tspan x="950" dy="0">SFT</tspan></text><text x="950" y="398" fill="#C9CDD2" font-size="17" font-weight="400" text-anchor="middle" opacity="1"><tspan x="950" dy="0">120 万条示范</tspan></text><line x1="1114" y1="385" x2="1132" y2="385" stroke="#C9CDD2" stroke-width="2" opacity="1" marker-end="url(#asv)"/><rect x="1135" y="320" width="320" height="130" rx="12" fill="#FFE0661F" opacity="1" stroke="#FFE066" stroke-width="2"/><text x="1295" y="362" fill="#FFE066" font-size="26" font-weight="900" text-anchor="middle" opacity="1"><tspan x="1295" dy="0">蒸馏</tspan></text><text x="1295" y="398" fill="#C9CDD2" font-size="17" font-weight="400" text-anchor="middle" opacity="1"><tspan x="1295" dy="0">对「训到这一步的模型」</tspan><tspan x="1295" dy="25">再补推理</tspan></text><line x1="1459" y1="385" x2="1477" y2="385" stroke="#C9CDD2" stroke-width="2" opacity="1" marker-end="url(#asv)"/><rect x="1480" y="320" width="320" height="130" rx="12" fill="#FC62551F" opacity="1" stroke="#FC6255" stroke-width="2"/><text x="1640" y="362" fill="#FC6255" font-size="26" font-weight="900" text-anchor="middle" opacity="1"><tspan x="1640" dy="0">强化学习</tspan></text><text x="1640" y="398" fill="#C9CDD2" font-size="17" font-weight="400" text-anchor="middle" opacity="1"><tspan x="1640" dy="0"></tspan></text><circle cx="117" cy="511" r="17" fill="#FFE066"/><text x="117" y="518" fill="#16181B" font-size="20" font-weight="900" text-anchor="middle" opacity="1"><tspan x="117" dy="0">1</tspan></text><text x="146" y="520" fill="#FFE066" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="146" dy="0">拼进来时，很可能还没蒸过（推断）</tspan></text><text x="100" y="560" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="100" dy="0">后面要接着做海量预训练，按惯例从 base 版本开始；</tspan><tspan x="100" dy="33">在 Qwen3 自己的流程里，蒸馏本来就是后训练的一步。</tspan></text><circle cx="117" cy="691" r="17" fill="#FFE066"/><text x="117" y="698" fill="#16181B" font-size="20" font-weight="900" text-anchor="middle" opacity="1"><tspan x="117" dy="0">2</tspan></text><text x="146" y="700" fill="#FFE066" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="146" dy="0">放前面也会被冲淡（推断）</tspan></text><text x="100" y="740" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="100" dy="0">拼接后大模型要全参续训 2 万多亿 token；</tspan><tspan x="100" dy="33">对话、推理这类「行为」最容易被续训改掉，</tspan><tspan x="100" dy="33">和本集讲的遗忘是同一个问题。</tspan></text><circle cx="997" cy="511" r="17" fill="#FFE066"/><text x="997" y="518" fill="#16181B" font-size="20" font-weight="900" text-anchor="middle" opacity="1"><tspan x="997" dy="0">3</tspan></text><text x="1026" y="520" fill="#FFE066" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="1026" dy="0">OPD 只能对最终的学生做（方法决定）</tspan></text><text x="980" y="560" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="980" dy="0">学生自己写、老师纠正，纠的是「这个学生现在会犯的错」；</tspan><tspan x="980" dy="33">拼接前蒸，蒸的是另一个模型。</tspan></text><circle cx="997" cy="691" r="17" fill="#5CD0B3"/><text x="997" y="698" fill="#16181B" font-size="20" font-weight="900" text-anchor="middle" opacity="1"><tspan x="997" dy="0">4</tspan></text><text x="1026" y="700" fill="#5CD0B3" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="1026" dy="0">最终结果（报告数据）</tspan></text><text x="980" y="740" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="980" dy="0">AIME-25（纯文本）：Instruct 20.9 → 45.9，</tspan><tspan x="980" dy="33">Thinking 67.3 → 80.3（Qwen3-8B → Qwen3-VL-8B）；</tspan><tspan x="980" dy="33">报告没做先后对比，不能证明这样排更好。</tspan></text><text x="100" y="900" fill="#9AA0A6" font-size="20" font-weight="400" text-anchor="start" opacity="1"><tspan x="100" dy="0">报告没有做「蒸馏放前面 vs 放后面」的对比；① ② 是推断，不是报告结论。</tspan></text></g></svg><div class="take">塑造<i>行为</i>的步骤，放在最后</div><div class="foot">来源：Qwen3-VL 技术报告 arXiv 2511.21631 §3.1、§4.1、Table 9/10；Qwen3 技术报告 arXiv 2505.09388 §4</div></body></html>
