<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>io</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#16181B;--card:#202328;--card2:#272B31;--fg:#ECECEC;--mu:#9AA0A6;--bl:#58C4DD;--yl:#FFE066;--gr:#5CD0B3;--rd:#FC6255;--pu:#B189F5}
html,body{margin:0;background:#16181B}*{box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);font-family:"Noto Sans SC",sans-serif;padding:72px 100px;-webkit-font-smoothing:antialiased;text-wrap:pretty}
h1{font:900 54px/1.25 "Noto Sans SC";margin:0;letter-spacing:.01em}
.sub{font-size:25px;color:var(--mu);margin-top:14px;line-height:1.5;max-width:1600px}
.bl{color:var(--bl)}.yl{color:var(--yl)}.gr{color:var(--gr)}.rd{color:var(--rd)}.pu{color:var(--pu)}.mu{color:var(--mu)}
.mono,.chip{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
.card{background:var(--card);border-radius:18px;padding:26px 30px}
.vec{display:inline-flex;gap:4px;vertical-align:middle}.vec i{width:18px;height:18px;display:block;border-radius:4px}
.vcol{display:inline-flex;flex-direction:column;gap:4px;vertical-align:middle}.vcol i{width:34px;height:12px;display:block;border-radius:3px}
.ar{color:#5F666E;font-size:40px;display:flex;align-items:center;justify-content:center}
.foot{position:absolute;left:100px;bottom:40px;font-size:18px;color:#6E757C}
.cat{display:block;object-fit:cover;border-radius:12px}
.chip{display:inline-block;font:500 22px Menlo,"SF Mono",monospace;padding:6px 12px;border-radius:8px;margin:4px}
table{border-collapse:collapse;width:100%}
td,th{padding:14px 18px;text-align:left;font-size:23px;border-bottom:1px solid #2E3238}
th{color:var(--mu);font-weight:500;font-size:20px}
.tag{display:inline-block;font-size:18px;padding:3px 10px;border-radius:6px;background:var(--card2);color:var(--mu)}
body{padding-top:96px}.nav{position:absolute;left:100px;right:100px;top:22px;display:flex;gap:10px}
.nv{border-top:4px solid #2E3238;padding-top:6px}.nv.past{border-color:#58C4DD66}.nv.cur{border-color:var(--c)}
.nl{font-size:16px;color:#6E757C;white-space:nowrap}.nv.past .nl{color:#8A9199}.nv.cur .nl{color:var(--c);font-weight:700}
.take{position:absolute;left:100px;right:100px;bottom:70px;font:900 30px "Noto Sans SC";border-top:2px solid #2E3238;padding-top:18px}.take i{font-style:normal;color:var(--yl)}
.foot{bottom:28px}.n{font-size:22px;line-height:1.7}.n b{display:block;font-size:26px;margin-bottom:8px}
.stp{font:700 22px "Noto Sans SC";color:var(--mu);margin-bottom:10px}.stp b{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--card2);color:var(--fg);align-items:center;justify-content:center;margin-right:8px;font-size:20px}.fig{position:absolute;left:0;top:0;font-family:"Noto Sans SC",sans-serif}.fig .m{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none}</style></head><body><div class="nav"><div class="nv cur" style="flex:4.5;--c:var(--fg)"><div class="nl">总览 · 1/2</div></div><div class="nv" style="flex:3.5;--c:var(--bl)"><div class="nl">切块</div></div><div class="nv" style="flex:3.5;--c:var(--bl)"><div class="nl">投影</div></div><div class="nv" style="flex:3.5;--c:var(--pu)"><div class="nl">编码</div></div><div class="nv" style="flex:3.5;--c:var(--gr)"><div class="nl">对齐</div></div><div class="nv" style="flex:3.5;--c:var(--yl)"><div class="nl">拼接</div></div><div class="nv" style="flex:4.5;--c:var(--rd)"><div class="nl">视频</div></div><div class="nv" style="flex:3.5;--c:var(--fg)"><div class="nl">总结</div></div></div><h1>输入输出：一张图 + 一个问题 → 一段回答</h1><div class="sub">看图模型 = 视觉编码器 + 合并器 + 大语言模型。前两块负责把图变成 token，最后一块和纯文本模型一样，读一串 token、一个字一个字地写回答。</div><svg class="fig" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="abl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#58C4DD"/></marker><marker id="ayl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FFE066"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5CD0B3"/></marker><marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#FC6255"/></marker><marker id="apu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B189F5"/></marker><marker id="amu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9AA0A6"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ECECEC"/></marker><marker id="adk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5F666E"/></marker><marker id="aln" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2E3238"/></marker><marker id="acard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#202328"/></marker><marker id="acard2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#272B31"/></marker><marker id="abg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#16181B"/></marker><marker id="asv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C9CDD2"/></marker></defs><g transform="translate(0,0)"><text x="100" y="330" fill="#9AA0A6" font-size="22" font-weight="700" text-anchor="start" opacity="1"><tspan x="100" dy="0">输入</tspan></text><svg x="100" y="350" width="240" height="240" viewBox="20 0 320 320" preserveAspectRatio="xMidYMid slice"><image href="../assets/cat.png" width="360" height="320"/></svg><rect x="100" y="610" width="240" height="50" rx="8" fill="#58C4DD33" opacity="1"/><text x="220.0" y="643.64" fill="#58C4DD" font-size="24" font-weight="500" text-anchor="middle" opacity="1"><tspan x="220.0" dy="0">图里是什么？</tspan></text><line x1="360" y1="470" x2="420" y2="470" stroke="#C9CDD2" stroke-width="3" opacity="1" marker-end="url(#asv)"/><text x="430" y="330" fill="#9AA0A6" font-size="22" font-weight="700" text-anchor="start" opacity="1"><tspan x="430" dy="0">模型：三块拼起来</tspan></text><rect x="430" y="350" width="380" height="240" rx="16" fill="#202328" opacity="1" stroke="#58C4DD" stroke-width="3"/><text x="456" y="396" fill="#58C4DD" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="456" dy="0">视觉编码器 ViT</tspan></text><text x="456" y="438" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="456" dy="0">「眼睛」：把图变成向量</tspan><tspan x="456" dy="33">27 层 · 宽 1152</tspan><tspan x="456" dy="33">约 4.2 亿参数</tspan></text><line x1="812" y1="470" x2="846" y2="470" stroke="#C9CDD2" stroke-width="3" opacity="1" marker-end="url(#asv)"/><rect x="850" y="350" width="340" height="240" rx="16" fill="#202328" opacity="1" stroke="#5CD0B3" stroke-width="3"/><text x="876" y="396" fill="#5CD0B3" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="876" dy="0">合并器</tspan></text><text x="876" y="438" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="876" dy="0">「翻译」：压缩 + 换成</tspan><tspan x="876" dy="33">大模型的语言</tspan><tspan x="876" dy="33">约 1.6 亿参数</tspan></text><line x1="1192" y1="470" x2="1226" y2="470" stroke="#C9CDD2" stroke-width="3" opacity="1" marker-end="url(#asv)"/><rect x="1230" y="350" width="380" height="240" rx="16" fill="#202328" opacity="1" stroke="#FFE066" stroke-width="3"/><text x="1256" y="396" fill="#FFE066" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="1256" dy="0">大语言模型 Qwen3</tspan></text><text x="1256" y="438" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="1256" dy="0">「大脑」：读图和问题，</tspan><tspan x="1256" dy="33">逐字写出回答</tspan><tspan x="1256" dy="33">36 层 · 宽 4096 · 约 81.9 亿</tspan></text><line x1="1612" y1="470" x2="1646" y2="470" stroke="#C9CDD2" stroke-width="3" opacity="1" marker-end="url(#asv)"/><text x="1660" y="330" fill="#9AA0A6" font-size="22" font-weight="700" text-anchor="start" opacity="1"><tspan x="1660" dy="0">输出</tspan></text><text x="1660" y="460" fill="#ECECEC" font-size="28" font-weight="700" text-anchor="start" opacity="1"><tspan x="1660" dy="0">「一只猫，</tspan><tspan x="1660" dy="42">正盯着镜头。」</tspan></text><text x="1660" y="560" fill="#9AA0A6" font-size="18" font-weight="400" text-anchor="start" opacity="1"><tspan x="1660" dy="0">（示意）</tspan></text><circle cx="447" cy="691" r="17" fill="#58C4DD"/><text x="447" y="698" fill="#16181B" font-size="20" font-weight="900" text-anchor="middle" opacity="1"><tspan x="447" dy="0">1</tspan></text><text x="476" y="700" fill="#58C4DD" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="476" dy="0">名字叫 8B，实际约 87.7 亿</tspan></text><text x="430" y="740" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="430" dy="0">视觉侧 5.8 亿（ViT 4.2 亿 + 4 个合并器 1.6 亿），</tspan><tspan x="430" dy="33">大模型 81.9 亿；两项相加与权重文件大小对得上。</tspan></text><circle cx="1117" cy="691" r="17" fill="#FFE066"/><text x="1117" y="698" fill="#16181B" font-size="20" font-weight="900" text-anchor="middle" opacity="1"><tspan x="1117" dy="0">2</tspan></text><text x="1146" y="700" fill="#FFE066" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="1146" dy="0">大模型只认 token</tspan></text><text x="1100" y="740" fill="#C9CDD2" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="1100" dy="0">它本来只会读文字。看图的全部问题，</tspan><tspan x="1100" dy="33">就是把图变成它能读的 token。</tspan></text></g></svg><div class="take">看图的关键不在大模型，而在<i>怎么把图变成它能读的 token</i></div><div class="foot">来源：Hugging Face Qwen/Qwen3-VL-8B-Instruct 的 config 与预处理配置、transformers qwen3_vl 源码（2026-10 核对）；参数量按 config 逐项计算，合计 8,767,123,696</div></body></html>
