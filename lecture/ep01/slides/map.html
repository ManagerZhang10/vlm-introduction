ke-width="3" opacity="1" marker-end="url(#ayl)"/><text x="1518" y="590" fill="#9AA0A6" font-size="20" font-weight="400" text-anchor="start" opacity="1"><tspan x="1518" dy="0">出</tspan></text><text x="1518" y="628" fill="#FFE066" font-size="26" font-weight="900" text-anchor="start" opacity="1" class="m"><tspan x="1518" dy="0">196 + 问题</tspan></text><text x="1518" y="700" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="start" opacity="1"><tspan x="1518" dy="0">和问题排成一串进大模型</tspan></text><text x="100" y="810" fill="#ECECEC" font-size="26" font-weight="500" text-anchor="start" opacity="1" class="m"><tspan x="100" dy="0">token 个数　784 → 784 → 784 → <tspan fill="#5CD0B3" font-weight="900">196</tspan> → 196 + 问题</tspan></text><text x="100" y="860" fill="#ECECEC" font-size="26" font-weight="500" text-anchor="start" opacity="1" class="m"><tspan x="100" dy="0">每个 token 的宽度　768 → <tspan fill="#58C4DD" font-weight="900">1152</tspan> → 1152 → <tspan fill="#5CD0B3" font-weight="900">4096</tspan> → 4096</tspan></text></g></svg><div class="take">只有两步改形状：投影把宽度变成 <i>1152</i>，对齐把 784 块压成 <i>196 个 4096 维</i> 的 token</div><div class="foot">来源：Hugging Face Qwen/Qwen3-VL-8B-Instruct 的 config 与预处理配置、transformers qwen3_vl 源码（2026-10 核对）</div></body></html>
