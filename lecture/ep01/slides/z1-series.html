<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>z1-series</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#16181B;--card:#202328;--card2:#272B31;--fg:#ECECEC;--mu:#9AA0A6;--bl:#58C4DD;--yl:#FFE066;--gr:#5CD0B3;--rd:#FC6255;--pu:#B189F5}
html,body{margin:0;background:#16181B}*{box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);font-family:"Noto Sans SC",sans-serif;padding:72px 100px;-webkit-font-smoothing:antialiased;text-wrap:pretty}
h1{font:900 54px/1.25 "Noto Sans SC";margin:0;letter-spacing:.01em}
.sub{font-size:25px;color:var(--mu);margin-top:14px;line-height:1.5;max-width:1600px}
.bl{color:var(--bl)}.yl{color:var(--yl)}.gr{color:var(--gr)}.rd{color:var(--rd)}.pu{color:var(--pu)}.mu{color:var(--mu)}
.mono,.chip{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
.card{background:var(--card);border-radius:18px;padding:26px 30px}

.foot{position:absolute;left:100px;bottom:40px;font-size:18px;color:#6E757C}
.cat{display:block;object-fit:cover;border-radius:12px}
.chip{display:inline-block;font:500 22px Menlo,"SF Mono",monospace;padding:6px 12px;border-radius:8px;margin:4px}
table{border-collapse:collapse;width:100%}
td,th{padding:14px 18px;text-align:left;font-size:23px;border-bottom:1px solid #2E3238}
th{color:var(--mu);font-weight:500;font-size:20px}
.tag{display:inline-block;font-size:18px;padding:3px 10px;border-radius:6px;background:var(--card2);color:var(--mu)}
body{padding-top:96px}.nav{position:absolute;left:100px;right:100px;top:22px;display:flex;gap:10px}
.nv{border-top:4px solid #2E3238;padding-top:6px}.nv.past{border-color:#58C4DD66}.nv.cur{border-color:var(--c)}
.nl{font-size:16px;color:#6E757C;white-space:nowrap}.nv.past .nl{color:#8A9199}.nv.cur .nl{color:var(--c);font-weight:700}

.foot{bottom:28px}.n{font-size:22px;line-height:1.7}.n b{display:block;font-size:26px;margin-bottom:8px}

ity="1"><tspan x="1304" dy="0">对齐</tspan></text><text x="1304" y="448" fill="#C9CDD2" font-size="20" font-weight="500" text-anchor="middle" opacity="1" class="m"><tspan x="1304" dy="0">196 × 4096</tspan></text><line x1="1466" y1="405" x2="1488" y2="405" stroke="#C9CDD2" stroke-width="2" opacity="1" marker-end="url(#asv)"/><rect x="1492" y="340" width="320" height="130" rx="14" fill="#FFE0661F" opacity="1" stroke="#FFE066" stroke-width="2"/><circle cx="1526" cy="372" r="17" fill="#FFE066"/><text x="1526" y="379" fill="#16181B" font-size="20" font-weight="900" text-anchor="middle" opacity="1"><tspan x="1526" dy="0">5</tspan></text><text x="1652" y="410" fill="#FFE066" font-size="32" font-weight="900" text-anchor="middle" opacity="1"><tspan x="1652" dy="0">拼接</tspan></text><text x="1652" y="448" fill="#C9CDD2" font-size="20" font-weight="500" text-anchor="middle" opacity="1" class="m"><tspan x="1652" dy="0">+ 问题 → 大模型</tspan></text><path d="M100,512 L100,500 L1460,500 L1460,512" stroke="#58C4DD" stroke-width="2" fill="none" opacity="1"/><line x1="780.0" y1="500" x2="780.0" y2="488" stroke="#58C4DD" stroke-width="2" opacity="1"/><text x="780" y="550" fill="#58C4DD" font-size="22" font-weight="700" text-anchor="middle" opacity="1"><tspan x="780" dy="0">EP02 视觉编码：缩放、切块、位置编码、ViT、合并器、视频怎么切</tspan></text><path d="M1144,612 L1144,600 L1812,600 L1812,612" stroke="#FFE066" stroke-width="2" fill="none" opacity="1"/><line x1="1478.0" y1="600" x2="1478.0" y2="588" stroke="#FFE066" stroke-width="2" opacity="1"/><text x="1478" y="650" fill="#FFE066" font-size="22" font-weight="700" text-anchor="middle" opacity="1"><tspan x="1478" dy="0">EP03 大模型怎么读图：占位符、DeepStack、</tspan><tspan x="1478" dy="33">图文顺序、三维位置、时间戳、谁能看见谁</tspan></text><rect x="100" y="720" width="1720" height="110" rx="14" fill="#202328" opacity="1"/><text x="130" y="770" fill="#5CD0B3" font-size="26" font-weight="900" text-anchor="start" opacity="1"><tspan x="130" dy="0">EP04 训练：这 87 亿个参数是怎么一步步训出来的</tspan></text><text x="130" y="808" fill="#C9CDD2" font-size="20" font-weight="400" text-anchor="start" opacity="1"><tspan x="130" dy="0">起点两块现成模型 + 一个随机合并器 → 预训练四段 → 监督微调 → 蒸馏 → 强化学习</tspan></text><text x="100" y="890" fill="#9AA0A6" font-size="22" font-weight="400" text-anchor="start" opacity="1"><tspan x="100" dy="0">每集都有一份这样的网页讲义，在同一个仓库里：lecture/ep02、ep03、ep04。</tspan></text></g></svg><div class="take">一句话：把图片变成和文字一样的 <i>token</i>，再交给大语言模型去读</div></body></html>
